<html data-type="html" data-identifier="dc3b6f66-93c0-4a98-8323-4a2388a7b419" data-title="Liquidity Hunter" data-version="61"><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
<style>
:root{
  --bg:#0b0f17;--surface:#0f1520;--surface2:#141d2b;--surface3:#1a2535;
  --border:#1e2d40;--border2:#2a3a52;
  --text:#e4eaf2;--text2:#96a6b8;--text3:#5e7082;
  --green:#2ea06b;--green2:#3dd68c;--red:#c93a3a;--red2:#f6465d;
  --yellow:#e8a817;--yellow2:#f0b90b;--purple:#a855f7;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-data:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --trans:.2s cubic-bezier(.4,0,.2,1);
  --sheet-trans:.32s cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4a62}

body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-data);font-size:12px;
  width:100%;height:100vh;height:100dvh;
  overflow:hidden;display:flex;flex-direction:column
}

/* ── HEADER ──────────────────────────────────── */
#hdr{
  height:54px;flex-shrink:0;
  background:linear-gradient(180deg,#171f2e 0%,var(--surface2) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  position:relative;z-index:20
}
.logo{
  font-size:15px;font-weight:700;color:var(--yellow2);
  letter-spacing:1.5px;white-space:nowrap;
  text-shadow:0 0 28px rgba(240,185,11,.4),0 0 56px rgba(240,185,11,.15)
}
.hdr-sep{width:1px;height:26px;background:var(--border2);flex-shrink:0}
.price-block{display:flex;flex-direction:column;gap:2px}
.price-top{display:flex;align-items:center;gap:8px}
#pair-sym{font-family:var(--font-ui);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
#exch-badge{font-family:var(--font-ui);font-size:9px;padding:1px 6px;border-radius:10px;font-weight:600;background:rgba(246,70,93,.1);color:var(--red2);border:1px solid rgba(246,70,93,.2)}
#live-price{font-size:22px;font-weight:700;color:var(--green2);transition:color .25s;line-height:1}
#live-price.dn{color:var(--red2)}
.log-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--surface3);border:1px solid var(--border2);color:var(--text2);
  padding:6px 12px;border-radius:8px;font-family:var(--font-ui);font-size:11px;
  cursor:pointer;transition:var(--trans);white-space:nowrap;flex-shrink:0
}
.log-btn:hover{border-color:var(--purple);color:var(--purple);background:rgba(168,85,247,.07);box-shadow:0 0 12px rgba(168,85,247,.15)}
.log-btn.has-active{border-color:rgba(61,214,140,.4);color:var(--green2);animation:tradeGlow 2s infinite}
@keyframes tradeGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px rgba(61,214,140,.25)}}
.log-count{font-size:9px;font-weight:700;background:var(--purple);color:#fff;padding:1px 5px;border-radius:8px;display:none}
.log-count.show{display:inline}
.thr-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.thr-wrap label{font-family:var(--font-ui);font-size:11px;color:var(--text2);white-space:nowrap}
#thr-inp{
  background:var(--surface3);border:1px solid var(--border2);color:var(--yellow2);
  padding:5px 7px;border-radius:6px;font-family:var(--font-data);font-size:11px;
  width:80px;outline:none;transition:var(--trans)
}
#thr-inp:focus{border-color:rgba(240,185,11,.5);box-shadow:0 0 0 2px rgba(240,185,11,.08)}
#auto-thr-btn{font-family:var(--font-ui);font-size:10px;padding:4px 10px;border-radius:5px;cursor:pointer;font-weight:600;transition:var(--trans);white-space:nowrap;line-height:1.4}
#auto-thr-btn.auto{background:rgba(46,160,107,.12);border:1px solid rgba(46,160,107,.3);color:var(--green2)}
#auto-thr-btn.auto:hover{background:rgba(46,160,107,.22);box-shadow:0 0 8px rgba(46,160,107,.2)}
#auto-thr-btn.manual{background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.25);color:var(--yellow2)}
.conn-wrap{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
#conn-txt{font-family:var(--font-ui);font-size:11px;color:var(--text2)}
#conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red2);flex-shrink:0;transition:background .3s}
#conn-dot.on{background:#2ea06b;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,160,107,.5)}60%{box-shadow:0 0 0 5px rgba(46,160,107,0)}}

/* ── COIN DROPDOWN ───────────────────────────── */
.coin-dropdown{position:relative;flex-shrink:0}
.coin-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--surface3);border:1px solid var(--border2);
  padding:6px 12px;border-radius:8px;cursor:pointer;
  transition:var(--trans);min-width:140px;justify-content:space-between
}
.coin-btn:hover{border-color:rgba(240,185,11,.45);box-shadow:0 0 12px rgba(240,185,11,.08)}
.coin-btn.open{border-color:rgba(240,185,11,.6);background:rgba(240,185,11,.05);box-shadow:0 0 16px rgba(240,185,11,.12)}
.coin-btn-info{display:flex;flex-direction:column;gap:2px}
.coin-btn-sym{font-size:13px;font-weight:700;color:var(--yellow2);line-height:1}
.coin-btn-px{font-family:var(--font-ui);font-size:10px;color:var(--text2)}
.coin-btn-arrow{font-size:11px;color:var(--text3);transition:transform .22s}
.coin-btn.open .coin-btn-arrow{transform:rotate(180deg)}
.coin-panel{
  position:absolute;top:calc(100% + 8px);left:0;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:14px;padding:10px;z-index:500;display:none;
  width:500px;
  box-shadow:0 24px 64px rgba(0,0,0,.96),0 0 0 1px rgba(255,255,255,.03);
  flex-direction:column;
  animation:panelIn .18s ease
}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.coin-panel.open{display:flex}
.coin-panel-hdr{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;flex-shrink:0}
.coin-panel-title{font-family:var(--font-ui);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.coin-panel-count{font-family:var(--font-ui);font-size:10px;color:var(--text3)}
.coin-search-wrap{position:relative;margin-bottom:8px;flex-shrink:0}
#coin-search{
  width:100%;background:var(--surface3);border:1px solid var(--border2);
  color:var(--text);padding:7px 10px 7px 30px;border-radius:8px;
  font-family:var(--font-ui);font-size:11px;outline:none;transition:var(--trans)
}
#coin-search:focus{border-color:rgba(240,185,11,.4);box-shadow:0 0 0 2px rgba(240,185,11,.08)}
.coin-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text3);pointer-events:none}
.coin-loading{font-family:var(--font-ui);font-size:11px;color:var(--text3);text-align:center;padding:20px;animation:fadeP 1.5s infinite}
@keyframes fadeP{0%,100%{opacity:1}50%{opacity:.3}}
.coin-grid-scroll{overflow-y:auto;max-height:300px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.coin-item{
  background:rgba(255,255,255,.025);border:1px solid var(--border);
  border-radius:8px;padding:7px 3px 6px;cursor:pointer;transition:var(--trans);
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center
}
.coin-item:hover{border-color:rgba(240,185,11,.5);background:rgba(240,185,11,.07);transform:translateY(-1px);box-shadow:0 2px 8px rgba(240,185,11,.12)}
.coin-item.active{border-color:rgba(61,214,140,.6);background:rgba(61,214,140,.08);box-shadow:0 0 10px rgba(61,214,140,.1)}
.coin-item-sym{font-size:9px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.coin-item-vol{font-family:var(--font-ui);font-size:7px;color:var(--text3);height:9px}
.coin-item.active .coin-item-sym{color:var(--green2)}
.coin-item.active .coin-item-vol{color:rgba(61,214,140,.5)}

/* ── MAIN LAYOUT ─────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#chart-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}

/* ── CHART TOP BAR ───────────────────────────── */
#chart-top{
  height:40px;flex-shrink:0;
  background:linear-gradient(180deg,var(--surface2) 0%,rgba(18,25,38,.97) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px
}
.cstat{display:flex;flex-direction:column;align-items:center;min-width:52px;gap:1px}
.cstat-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.cstat-val{font-family:var(--font-data);font-size:12px;font-weight:600;color:var(--text)}
.cstat-sep{width:1px;height:20px;background:var(--border2);flex-shrink:0}
#cs-cvd.bull{color:var(--green2)}#cs-cvd.bear{color:var(--red2)}#cs-cvd.flat{color:var(--text2)}
.candle-timer-wrap{display:flex;flex-direction:column;align-items:center;min-width:60px;gap:1px}
.candle-timer-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
#cs-candle{font-family:var(--font-data);font-size:14px;font-weight:700;color:var(--green2);letter-spacing:.5px;transition:color .3s;line-height:1}
#cs-candle.warn{color:var(--yellow2)}
#cs-candle.urgent{color:var(--red2);animation:timerPulse .5s infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.4}}
.candle-timer-outer{display:flex;align-items:center;gap:8px}
.candle-progress-bar{width:48px;height:4px;background:var(--border2);border-radius:2px;overflow:hidden}
.candle-progress-fill{height:100%;border-radius:2px;transition:width .9s linear,background .3s}
.tf-grp{display:flex;gap:2px;margin-left:auto}
.tf-btn{
  background:transparent;border:1px solid transparent;color:var(--text2);
  padding:4px 10px;border-radius:5px;font-family:var(--font-ui);font-size:11px;
  font-weight:500;cursor:pointer;transition:var(--trans);white-space:nowrap
}
.tf-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tf-btn.active{background:rgba(240,185,11,.12);border-color:rgba(240,185,11,.32);color:var(--yellow2);font-weight:700}
#bubble-btn{
  display:flex;align-items:center;gap:5px;background:var(--surface3);
  border:1px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:6px;
  font-family:var(--font-ui);font-size:10px;font-weight:600;cursor:pointer;
  transition:var(--trans);white-space:nowrap;letter-spacing:.3px;margin-left:4px
}
#bubble-btn.live{border-color:rgba(61,214,140,.35);color:var(--green2);background:rgba(61,214,140,.07)}
#bubble-btn.fade{border-color:rgba(240,185,11,.35);color:var(--yellow2);background:rgba(240,185,11,.07)}
.bubble-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#bubble-btn.live .bubble-dot{background:var(--green2)}
#bubble-btn.fade .bubble-dot{background:var(--yellow2);animation:bubPulse 1.5s infinite}
@keyframes bubPulse{0%,100%{opacity:1}50%{opacity:.4}}
#chart-loading{font-family:var(--font-ui);font-size:10px;color:var(--text3);margin-left:2px}
#mobile-panel-btn{display:none}

/* ── CHART BODY ──────────────────────────────── */
#chart-body{flex:1;position:relative;overflow:hidden;cursor:crosshair;touch-action:none}
#chart-cv{display:block;width:100%;height:100%}
#crosshair-cv{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* ── SIGNALS PANEL ───────────────────────────── */
#signals-panel{
  width:262px;min-width:262px;border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
  background:var(--surface);flex-shrink:0
}
.panel-handle{display:none}
.sig-section{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sig-section:last-child{border-bottom:none;flex:1}
.sig-section-hdr{
  font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px
}
.sig-section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.sig-empty{font-family:var(--font-ui);font-size:11px;color:var(--text3);padding:4px 0;font-style:italic}
.liq-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.liq-row:last-child{border-bottom:none}
.liq-badge{font-family:var(--font-ui);font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;letter-spacing:.2px}
.liq-badge.bsl{background:rgba(61,214,140,.1);color:var(--green2);border:1px solid rgba(61,214,140,.22)}
.liq-badge.ssl{background:rgba(246,70,93,.08);color:var(--red2);border:1px solid rgba(246,70,93,.18)}
.liq-badge.eq{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.22)}
.liq-price{color:var(--text);font-weight:600;flex:1;font-size:11px}
.liq-dist{font-family:var(--font-ui);font-weight:700;font-size:11px;white-space:nowrap}
.liq-dist.up{color:var(--green2)}.liq-dist.dn{color:var(--red2)}
.liq-sep{height:1px;background:var(--border);margin:5px 0}
.sig-ctx-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.sig-ctx-item:last-child{border-bottom:none}
.sig-ctx-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.sig-ctx-val{font-family:var(--font-data);color:var(--text2);font-weight:600;font-size:11px;text-align:right}

/* ── WALL BIAS ───────────────────────────────── */
.wall-bias-item{padding:7px 0 3px;border-top:1px solid rgba(255,255,255,.03);margin-top:3px}
.wall-bias-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.wall-bias-status{font-family:var(--font-data);font-weight:700;font-size:11px;color:var(--text2)}
.wall-bias-bar-outer{height:6px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;margin-bottom:5px}
.wall-bias-bar-bid{height:100%;background:var(--green2);transition:width .6s ease}
.wall-bias-bar-ask{height:100%;background:var(--red2);transition:width .6s ease}
.wall-bias-amounts{display:flex;justify-content:space-between}
.wall-bias-amt{font-family:var(--font-ui);font-size:9px;font-weight:600}

/* ── TRADE BUTTONS ───────────────────────────── */
.manual-trade-btns{display:flex;gap:8px}
.manual-long-btn{
  flex:1;background:rgba(46,160,107,.1);border:1px solid rgba(46,160,107,.26);
  color:var(--green2);padding:14px 4px;border-radius:10px;
  font-family:var(--font-ui);font-size:13px;cursor:pointer;font-weight:700;
  transition:var(--trans);text-align:center;min-height:48px
}
.manual-long-btn:hover{background:rgba(46,160,107,.2);border-color:rgba(46,160,107,.55);transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,160,107,.2)}
.manual-short-btn{
  flex:1;background:rgba(201,58,58,.08);border:1px solid rgba(201,58,58,.22);
  color:var(--red2);padding:14px 4px;border-radius:10px;
  font-family:var(--font-ui);font-size:13px;cursor:pointer;font-weight:700;
  transition:var(--trans);text-align:center;min-height:48px
}
.manual-short-btn:hover{background:rgba(201,58,58,.18);border-color:rgba(201,58,58,.48);transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,58,58,.2)}

/* ── ENTRY FORM ──────────────────────────────── */
.entry-form{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.ef-dir{font-family:var(--font-ui);font-size:14px;font-weight:700;text-align:center;padding:9px;border-radius:8px;margin-bottom:10px}
.ef-dir.long{background:rgba(46,160,107,.12);color:var(--green2);border:1px solid rgba(46,160,107,.28)}
.ef-dir.short{background:rgba(201,58,58,.1);color:var(--red2);border:1px solid rgba(201,58,58,.25)}
.ef-drag-hint{font-family:var(--font-ui);font-size:10px;color:var(--text3);text-align:center;margin-bottom:10px;padding:4px 8px;background:rgba(240,185,11,.05);border-radius:5px;border:1px solid rgba(240,185,11,.12)}
.ef-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ef-lbl{font-family:var(--font-ui);font-size:10px;font-weight:600;width:40px;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px}
.ef-lbl.entry-lbl{color:var(--yellow2)}.ef-lbl.tp-lbl{color:var(--green2)}.ef-lbl.sl-lbl{color:var(--red2)}.ef-lbl.tp2-lbl{color:rgba(61,214,140,.6)}
.ef-inp{
  flex:1;background:var(--surface3);border:1px solid var(--border2);color:var(--text);
  padding:7px 8px;border-radius:7px;font-family:var(--font-data);font-size:12px;
  outline:none;width:100%;transition:var(--trans);min-height:36px
}
.ef-inp:focus{border-color:rgba(240,185,11,.6);box-shadow:0 0 0 2px rgba(240,185,11,.1)}
.ef-inp.tp-inp:focus{border-color:rgba(61,214,140,.6);box-shadow:0 0 0 2px rgba(61,214,140,.08)}
.ef-inp.sl-inp:focus{border-color:rgba(246,70,93,.6);box-shadow:0 0 0 2px rgba(246,70,93,.08)}
.ef-inp.err{border-color:var(--red2)!important;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ef-rr-display{font-family:var(--font-data);font-size:13px;font-weight:700;text-align:center;padding:6px 0 5px;color:var(--yellow2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:6px 0}
.ef-btns{display:flex;gap:6px;margin-top:8px}
.ef-confirm{flex:1;background:rgba(46,160,107,.12);border:1px solid rgba(46,160,107,.3);color:var(--green2);padding:10px 4px;border-radius:7px;font-family:var(--font-ui);font-size:12px;cursor:pointer;font-weight:700;transition:var(--trans);min-height:40px}
.ef-confirm:hover{background:rgba(46,160,107,.24);box-shadow:0 2px 12px rgba(46,160,107,.2)}
.ef-cancel{background:transparent;border:1px solid var(--border2);color:var(--text3);padding:10px 12px;border-radius:7px;font-family:var(--font-ui);font-size:13px;cursor:pointer;transition:var(--trans);min-height:40px}
.ef-cancel:hover{color:var(--red2);border-color:rgba(246,70,93,.3)}

/* ── ACTIVE TRADE CARD ───────────────────────── */
.active-trade-card{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.atc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.atc-dir{font-family:var(--font-ui);font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.atc-dir.long{background:rgba(46,160,107,.12);color:var(--green2);border:1px solid rgba(46,160,107,.25)}
.atc-dir.short{background:rgba(201,58,58,.1);color:var(--red2);border:1px solid rgba(201,58,58,.22)}
.atc-pnl{font-family:var(--font-data);font-size:20px;font-weight:700;line-height:1}
.atc-entry-line{font-family:var(--font-ui);font-size:10px;color:var(--text3);margin-bottom:9px;margin-top:2px}
.atc-hint{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-align:center;padding:3px 0;margin-bottom:6px;opacity:.7}
.atc-lvl-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.atc-lvl-row:last-of-type{border-bottom:none;margin-bottom:9px}
.atc-lvl-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px}
.atc-lvl-val{font-family:var(--font-data);font-weight:600;color:var(--text2);font-size:11px}

function getCandleRemaining(){const now=Date.now();const ms=INTERVAL_MS[chartInterval]||300000;return ms-(now%ms);}
function formatCandleTime(r){const s=Math.ceil(r/1000),m=Math.floor(s/60),sec=s%60;if(m>0)return`${m}:${sec.toString().padStart(2,'0')}`;return`${s}s`;}

function drawCandleTimer(ctx,cW,cAH,lE,PW,H,TH){

function getLineAtY(mouseY){if(!chartLayout.cAH)return null;const HIT=14;if(tradeSetup){const lines=[{name:'t1',price:tradeSetup.t1,src:'setup'},{name:'sl',price:tradeSetup.sl,src:'setup'},{name:'entry',price:tradeSetup.entry,src:'setup'}];if(tradeSetup.t2)lines.push({name:'t2',price:tradeSetup.t2,src:'setup'});for(const l of lines){if(!l.price)continue;const y=priceToY(l.price);if(y>2&&y<chartLayout.cAH-2&&Math.abs(mouseY-y)<=HIT)return{name:l.name,src:'setup'};}return null;}if(activeLogEntry&&!activeLogEntry.outcome){const e=activeLogEntry,lines=[];if(e.t1)lines.push({name:'t1',price:e.t1.price});if(e.sl)lines.push({name:'sl',price:e.sl.price});lines.push({name:'entry',price:e.entry});if(e.t2)lines.push({name:'t2',price:e.t2.price});for(const l of lines){if(!l.price)continue;const y=priceToY(l.price);if(y>2&&y<chartLayout.cAH-2&&Math.abs(mouseY-y)<=HIT)return{name:l.name,src:'active'};}}return null;}
function updateActiveTradeLevel(key,price){if(!activeLogEntry||activeLogEntry.outcome||!price||isNaN(price))return;const e=activeLogEntry;if(key==='entry'){e.entry=price;if(e.t1)e.t1.pct=((e.t1.price-price)/price*100).toFixed(2);if(e.t2)e.t2.pct=((e.t2.price-price)/price*100).toFixed(2);if(e.sl)e.sl.pct=((e.sl.price-price)/price*100).toFixed(2);}else if(key==='t1'&&e.t1){e.t1.price=price;e.t1.pct=((price-e.entry)/e.entry*100).toFixed(2);}else if(key==='t2'&&e.t2){e.t2.price=price;e.t2.pct=((price-e.entry)/e.entry*100).toFixed(2);}else if(key==='sl'&&e.sl){e.sl.price=price;e.sl.pct=((price-e.entry)/e.entry*100).toFixed(2);}if(e.t1&&e.sl){const rew=Math.abs(e.t1.price-e.entry),risk=Math.abs(e.sl.price-e.entry);e.rr=risk>0?(rew/risk).toFixed(1):null;}renderManualEntryArea();saveTradeLog();}
function syncFormFromDrag(){if(!tradeSetup)return;const fmt=(v)=>v?v.toFixed(4):'';const set=(id,val)=>{const el=document.getElementById(id);if(el&&val!==null)el.value=fmt(val);};set('ef-entry',tradeSetup.entry);set('ef-t1',tradeSetup.t1);set('ef-sl',tradeSetup.sl);updateRRDisplay();}

function updateRRDisplay(){const el=document.getElementById('ef-rr');if(!el||!tradeSetup)return;const{entry,t1,sl}=tradeSetup;if(entry&&t1&&sl){const rew=Math.abs(t1-entry),risk=Math.abs(sl-entry);if(risk>0){const rr=(rew/risk).toFixed(1);el.textContent=`R/R  ${rr} : 1`;el.style.color=parseFloat(rr)>=1.5?'var(--green2)':parseFloat(rr)>=1.0?'var(--yellow2)':'var(--red2)';}}else el.textContent='—';}

function drawTradeSetupLines(ctx,cW,cAH,lE,PW){if(!tradeSetup)return;const defs=[{key:'entry',price:tradeSetup.entry,color:'#f0b90b',label:'ENTRY'},{key:'t1',price:tradeSetup.t1,color:'#3dd68c',label:'TP'},{key:'sl',price:tradeSetup.sl,color:'#f6465d',label:'SL'}];if(tradeSetup.t2)defs.push({key:'t2',price:tradeSetup.t2,color:'rgba(61,214,140,.7)',label:'TP2'});defs.forEach(def=>{if(!def.price)return;const y=priceToY(def.price);if(y<2||y>cAH-2)return;const isDrag=tradeSetup.dragging===def.key;ctx.strokeStyle=def.color+(isDrag?'':'bb');ctx.lineWidth=isDrag?2.5:1.5;ctx.setLineDash([10,5]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.setLineDash([]);const pw=108,ph=24,px=4,py=y-ph/2;ctx.fillStyle=def.color+(isDrag?'44':'22');ctx.beginPath();if(ctx.roundRect)ctx.roundRect(px,py,pw,ph,4);else ctx.rect(px,py,pw,ph);ctx.fill();ctx.strokeStyle=def.color+(isDrag?'ff':'88');ctx.lineWidth=isDrag?1.5:1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(px,py,pw,ph,4);else ctx.rect(px,py,pw,ph);ctx.stroke();ctx.fillStyle=def.color;ctx.font='bold 10px monospace';ctx.textAlign='left';ctx.fillText(`${def.label}  ${fPS(def.price)}`,px+7,y+3.5);const gx=cW-18;ctx.fillStyle=def.color+(isDrag?'cc':'66');[-4,0,4].forEach(dy=>ctx.fillRect(gx,y+dy-0.5,12,1.5));if(isDrag){ctx.fillStyle=def.color+'cc';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText('↕',cW/2,y-7);}});if(tradeSetup.entry&&tradeSetup.t1&&tradeSetup.sl){const rew=Math.abs(tradeSetup.t1-tradeSetup.entry),risk=Math.abs(tradeSetup.sl-tradeSetup.entry);if(risk>0){const rr=(rew/risk).toFixed(1),col=parseFloat(rr)>=1.5?'#3dd68c':parseFloat(rr)>=1.0?'#f0b90b':'#f6465d',ey=priceToY(tradeSetup.entry);if(ey>10&&ey<cAH-10){ctx.fillStyle='rgba(11,15,23,0.88)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(116,ey-10,68,18,4);else ctx.rect(116,ey-10,68,18);ctx.fill();ctx.fillStyle=col;ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText(`R/R ${rr}:1`,121,ey+3);}}}}
function drawCrosshairLines(ctx,cW,cAH,lE,PW,slotW,H){if(cursorY<0||cursorY>cAH)return;const cp=chartHi-(cursorY/cAH)*(chartHi-chartLo);ctx.strokeStyle='rgba(210,220,235,0.4)';ctx.lineWidth=1;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,cursorY);ctx.lineTo(cW,cursorY);ctx.stroke();if(cursorX>=0&&cursorX<=cW){ctx.strokeStyle='rgba(210,220,235,0.18)';ctx.beginPath();ctx.moveTo(cursorX,0);ctx.lineTo(cursorX,cAH);ctx.stroke();}ctx.setLineDash([]);if(cursorX>=0&&cursorX<=cW){ctx.beginPath();ctx.arc(cursorX,cursorY,3,0,Math.PI*2);ctx.fillStyle='rgba(210,220,235,0.7)';ctx.fill();}const lx=lE+1,lw=PW-2,lh=20;ctx.fillStyle='rgba(11,15,23,0.96)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(lx,cursorY-lh/2,lw,lh,3);else ctx.rect(lx,cursorY-lh/2,lw,lh);ctx.fill();ctx.strokeStyle='rgba(210,220,235,0.5)';ctx.lineWidth=1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(lx,cursorY-lh/2,lw,lh,3);else ctx.rect(lx,cursorY-lh/2,lw,lh);ctx.stroke();ctx.fillStyle='#e4eaf2';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText(fPS(cp),lx+4,cursorY+3.5);if(cursorX>=0&&cursorX<=cW&&slotW>0&&candles.length>0){const visLen=Math.floor(cW/slotW),vis=candles.slice(-visLen),idx=Math.min(Math.floor(cursorX/slotW),vis.length-1),c=vis[idx];if(c){const isUp=c.c2>=c.o,cCol=isUp?'#3dd68c':'#f6465d',parts=[{l:'O',v:fmtP(c.o),col:'#96a6b8'},{l:'H',v:fmtP(c.h),col:'#3dd68c'},{l:'L',v:fmtP(c.l),col:'#f6465d'},{l:'C',v:fmtP(c.c2),col:cCol},{l:'V',v:fmtV(c.v*c.c2),col:'#96a6b8'}];ctx.font='9px monospace';let totalW=12;parts.forEach(p=>{totalW+=ctx.measureText(p.l+' '+p.v+'  ').width;});ctx.fillStyle='rgba(11,15,23,0.88)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(6,5,Math.min(totalW,cW-12),20,4);else ctx.rect(6,5,Math.min(totalW,cW-12),20);ctx.fill();let px=12;parts.forEach(p=>{ctx.fillStyle='#5e7082';ctx.textAlign='left';ctx.font='9px monospace';ctx.fillText(p.l,px,19);ctx.fillStyle=p.col;const vs=' '+p.v;ctx.fillText(vs,px+7,19);px+=7+ctx.measureText(vs+'  ').width;});}}}
function redrawCrosshairCanvas(){const cv=document.getElementById('crosshair-cv');if(!cv)return;const{cAH,cW,lE,PW,slotW,H}=chartLayout;const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);if(tradeSetup)drawTradeSetupLines(ctx,cW,cAH,lE,PW);if(cursorX!==null&&cursorY!==null&&cAH>1&&chartHi>0&&!tradeSetup?.dragging&&!activeLineDrag)drawCrosshairLines(ctx,cW,cAH,lE,PW,slotW,H);}

// ── v61: Chart interaction + pointer/touch events ────────────
function initChartInteraction(){
  const body=document.getElementById('chart-body');

  // Mouse events
  body.addEventListener('mousemove',(e)=>{
    const rect=body.getBoundingClientRect();cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    if(tradeSetup?.dragging){tradeSetup[tradeSetup.dragging]=yToPrice(cursorY);syncFormFromDrag();redrawCrosshairCanvas();return;}
    if(activeLineDrag&&activeLogEntry&&!activeLogEntry.outcome){const np=yToPrice(cursorY);updateActiveTradeLevel(activeLineDrag,np);if(dragRafId)cancelAnimationFrame(dragRafId);dragRafId=requestAnimationFrame(()=>{drawChart();dragRafId=null;});return;}
    const lineInfo=getLineAtY(cursorY);body.style.cursor=lineInfo?'ns-resize':'crosshair';redrawCrosshairCanvas();
  });
  body.addEventListener('mousedown',(e)=>{
    if(!chartLayout.cAH)return;const rect=body.getBoundingClientRect();const my=e.clientY-rect.top;const lineInfo=getLineAtY(my);
    if(!lineInfo)return;if(lineInfo.src==='setup'&&tradeSetup)tradeSetup.dragging=lineInfo.name;else if(lineInfo.src==='active')activeLineDrag=lineInfo.name;
    body.style.cursor='ns-resize';e.preventDefault();
  });
  body.addEventListener('mouseup',()=>{
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    redrawCrosshairCanvas();
  });
  body.addEventListener('mouseleave',()=>{
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    cursorX=null;cursorY=null;redrawCrosshairCanvas();body.style.cursor='crosshair';
  });

  // Pointer events (touch + stylus)
  let pointerActive=false;
  body.addEventListener('pointerdown',(e)=>{
    if(e.pointerType==='mouse')return;
    body.setPointerCapture(e.pointerId);
    const rect=body.getBoundingClientRect();
    cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    const lineInfo=getLineAtY(cursorY);
    if(lineInfo){
      if(lineInfo.src==='setup'&&tradeSetup)tradeSetup.dragging=lineInfo.name;
      else if(lineInfo.src==='active')activeLineDrag=lineInfo.name;
    }
    pointerActive=true;
    redrawCrosshairCanvas();
  },{passive:true});

  body.addEventListener('pointermove',(e)=>{
    if(e.pointerType==='mouse'||!pointerActive)return;
    const rect=body.getBoundingClientRect();
    cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    if(tradeSetup?.dragging){tradeSetup[tradeSetup.dragging]=yToPrice(cursorY);syncFormFromDrag();redrawCrosshairCanvas();return;}
    if(activeLineDrag&&activeLogEntry&&!activeLogEntry.outcome){
      updateActiveTradeLevel(activeLineDrag,yToPrice(cursorY));
      if(dragRafId)cancelAnimationFrame(dragRafId);
      dragRafId=requestAnimationFrame(()=>{drawChart();dragRafId=null;});
      return;
    }
    redrawCrosshairCanvas();
  },{passive:true});

  body.addEventListener('pointerup',(e)=>{
    if(e.pointerType==='mouse')return;
    pointerActive=false;
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    setTimeout(()=>{cursorX=null;cursorY=null;redrawCrosshairCanvas();},1800);
  },{passive:true});

  body.addEventListener('pointercancel',()=>{
    pointerActive=false;if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;drawChart();}
    cursorX=null;cursorY=null;redrawCrosshairCanvas();
  },{passive:true});
}

async function loadAllBinancePairs(){
  const countEl=document.getElementById('coin-panel-count');
  try{
    const [infoRes,tickerRes]=await Promise.all([fetch('https://fapi.binance.com/fapi/v1/exchangeInfo'),fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);
    if(!infoRes.ok||!tickerRes.ok)throw new Error('API error');
    const info=await infoRes.json(),tickers=await tickerRes.json();
    const volMap={};tickers.forEach(t=>{volMap[t.symbol.toLowerCase()]=parseFloat(t.quoteVolume)||0;});
    const priceMap={};tickers.forEach(t=>{priceMap[t.symbol.toLowerCase()]=parseFloat(t.lastPrice)||0;});
    const usdtPerps=info.symbols.filter(s=>s.quoteAsset==='USDT'&&s.contractType==='PERPETUAL'&&s.status==='TRADING');
    ALL_COINS=usdtPerps.map(s=>{const symLower=s.symbol.toLowerCase(),base=s.baseAsset,displayBase=base.startsWith('1000')?base.slice(4):base.startsWith('10000')?base.slice(5):base;return{sym:symLower,base:displayBase,rawBase:base,display:`${displayBase}/USDT`,vol24h:volMap[symLower]||0,price:priceMap[symLower]||0};});
    ALL_COINS.sort((a,b)=>b.vol24h-a.vol24h);
    coinPrices={};ALL_COINS.forEach(c=>{coinPrices[c.sym]=c.price;});
    coinsLoaded=true;
    if(countEl)countEl.textContent=`${ALL_COINS.length} pairs · by volume`;
    renderCoinGrid(ALL_COINS);updateDropdownPrices();
  }catch(e){console.error('Pairs load failed:',e);loadFallbackCoins();}
}

function onKline(d){const k=d.k;if(k.i!==chartInterval)return;const c={t:k.t,o:+k.o,h:+k.h,l:+k.l,c2:+k.c,v:+k.v,live:!k.x};if(candles.length>0&&candles[candles.length-1].t===k.t){candles[candles.length-1]=c;}else if(k.t>(candles.length>0?candles[candles.length-1].t:0)){candles.push(c);if(candles.length>200)candles.shift();clearAnalysisCache();}if(!chartTimer){chartTimer=setTimeout(()=>{chartTimer=null;try{drawChart();}catch(e){}},400);}}

function updateWalls(b,a){const nb={},na={};b.forEach(x=>{if(x.usd>=THRESHOLD)nb[x.price]=x.usd;});a.forEach(x=>{if(x.usd>=THRESHOLD)na[x.price]=x.usd;});prevWalls={bids:nb,asks:na};}
function updateWallTs(b,a){const now=Date.now(),ac=new Set();b.forEach(x=>{if(x.usd>=THRESHOLD){const k=`bid-${x.price}`;ac.add(k);if(!wallTimestamps[k])wallTimestamps[k]=now;}});a.forEach(x=>{if(x.usd>=THRESHOLD){const k=`ask-${x.price}`;ac.add(k);if(!wallTimestamps[k])wallTimestamps[k]=now;}});Object.keys(wallTimestamps).forEach(k=>{if(!ac.has(k))delete wallTimestamps[k];});}
function detectHunts(nB,nA){const nb={},na={};nB.forEach(b=>{if(b.usd>=THRESHOLD)nb[b.price]=b.usd;});nA.forEach(a=>{if(a.usd>=THRESHOLD)na[a.price]=a.usd;});const tol=livePrice*0.002;Object.entries(prevWalls.bids).forEach(([ps,usd])=>{const p=parseFloat(ps);if(!nb[p]&&livePrice<=p+tol)addHunt(p,usd,'bid');});Object.entries(prevWalls.asks).forEach(([ps,usd])=>{const p=parseFloat(ps);if(!na[p]&&livePrice>=p-tol)addHunt(p,usd,'ask');});}
function addHunt(price,usd,side){const now=Date.now(),key=`${side}-${price}`;if(hunts.some(h=>h.key===key&&now-h.ts<8000))return;hunts.unshift({key,price,usd,side,ts:now});if(hunts.length>20)hunts.pop();}

function renderKeyLevels(){
  const vp=getVP(),ms=getMS(),cvd=calcNetCVD(),atr=calcATRPct(14);
  const cvdColor=cvd>0.1?'var(--green2)':cvd<-0.1?'var(--red2)':'var(--text2)';
  const s=id=>document.getElementById(id);
  if(s('kl-vpoc'))s('kl-vpoc').textContent=vp?fmtP(vp.vpocPrice):'—';
  if(s('kl-vah'))s('kl-vah').textContent=vp?fmtP(vp.vahPrice):'—';
  if(s('kl-val'))s('kl-val').textContent=vp?fmtP(vp.valPrice):'—';
  if(s('kl-cvd')){s('kl-cvd').textContent=(cvd>=0?'+':'')+(cvd*100).toFixed(0)+'%';s('kl-cvd').style.color=cvdColor;}
  if(s('kl-atr'))s('kl-atr').textContent=atr.toFixed(2)+'%/bar';
  if(s('kl-struct')&&ms){const arrow=ms.structure==='bullish'?'▲':ms.structure==='bearish'?'▼':'→';s('kl-struct').textContent=`${arrow} ${ms.structure.charAt(0).toUpperCase()+ms.structure.slice(1)}${ms.bos?' · BOS':''}`;s('kl-struct').style.color=ms.structure==='bullish'?'var(--green2)':ms.structure==='bearish'?'var(--red2)':'var(--text2)';}
  if(livePrice){
    const askWalls=book.asks.filter(o=>o.usd>=THRESHOLD&&o.price>livePrice);
    const bidWalls=book.bids.filter(o=>o.usd>=THRESHOLD&&o.price<livePrice);
    const totalAsk=askWalls.reduce((sum,o)=>sum+o.usd,0),totalBid=bidWalls.reduce((sum,o)=>sum+o.usd,0);
    const total=(totalAsk+totalBid)||1,bidPct=totalBid/total*100,askPct=100-bidPct;
    if(s('wb-bid-bar'))s('wb-bid-bar').style.width=(totalAsk+totalBid>0?bidPct:50).toFixed(1)+'%';
    if(s('wb-ask-bar'))s('wb-ask-bar').style.width=(totalAsk+totalBid>0?askPct:50).toFixed(1)+'%';
    if(s('wb-bid-amt'))s('wb-bid-amt').textContent=totalBid>0?`▲ ${fmtV(totalBid)} (${bidWalls.length})`:'▲ none';
    if(s('wb-ask-amt'))s('wb-ask-amt').textContent=totalAsk>0?`${fmtV(totalAsk)} (${askWalls.length}) ▼`:'none ▼';
    if(s('kl-wall-bias')){
      let lbl,col;
      if(totalAsk===0&&totalBid===0){lbl='No walls';col='var(--text3)';}
      else if(bidPct>=60){lbl='▲ BID HEAVY';col='var(--green2)';}
      else if(askPct>=60){lbl='▼ ASK HEAVY';col='var(--red2)';}
      else{lbl='⟷ BALANCED';col='var(--yellow2)';}
      s('kl-wall-bias').textContent=lbl;s('kl-wall-bias').style.color=col;
    }
  }
}

function openEntryForm(dir){manualEntryDir=dir;const area=document.getElementById('manual-entry-area');if(!area)return;const isLong=dir==='LONG',atr=calcATRPct(14),t1Dist=Math.max(1.0,atr*1.5)/100,slDist=Math.max(0.5,atr*0.8)/100;tradeSetup={dir,entry:livePrice,t1:isLong?livePrice*(1+t1Dist):livePrice*(1-t1Dist),t2:null,sl:isLong?livePrice*(1-slDist):livePrice*(1+slDist),dragging:null};const fmt=(v)=>v?v.toFixed(4):'';area.innerHTML=`<div class="entry-form"><div class="ef-dir ${isLong?'long':'short'}">${isLong?'▲ LONG':'▼ SHORT'} @ ${fmtP(livePrice)}</div><div class="ef-drag-hint">↕ Drag the colored lines on chart</div><div class="ef-row"><span class="ef-lbl entry-lbl">Entry</span><input class="ef-inp entry-inp" id="ef-entry" type="number" step="any" value="${fmt(tradeSetup.entry)}"></div><div class="ef-row"><span class="ef-lbl tp-lbl">TP</span><input class="ef-inp tp-inp" id="ef-t1" type="number" step="any" value="${fmt(tradeSetup.t1)}"></div><div class="ef-row"><span class="ef-lbl tp2-lbl">TP2</span><input class="ef-inp t2" id="ef-t2" type="number" step="any" placeholder="Optional"></div><div class="ef-row"><span class="ef-lbl sl-lbl">SL</span><input class="ef-inp sl-inp" id="ef-sl" type="number" step="any" value="${fmt(tradeSetup.sl)}"></div><div id="ef-rr" class="ef-rr-display">—</div><div class="ef-btns"><button class="ef-confirm" id="ef-confirm-btn">✓ CONFIRM</button><button class="ef-cancel" id="ef-cancel-btn">✗</button></div></div>`;document.getElementById('ef-confirm-btn').addEventListener('click',confirmManualEntry);document.getElementById('ef-cancel-btn').addEventListener('click',cancelEntryForm);['ef-entry','ef-t1','ef-t2','ef-sl'].forEach(id=>{const inp=document.getElementById(id);if(inp){inp.addEventListener('input',syncSetupFromForm);inp.addEventListener('keydown',e=>{if(e.key==='Enter')confirmManualEntry();if(e.key==='Escape')cancelEntryForm();});}});updateRRDisplay();redrawCrosshairCanvas();}

function manualLogSetup(dir,entryPrice,t1Price,t2Price,slPrice){const ms=getMS(),vp=getVP(),atrPct=calcATRPct(14),coin=document.getElementById('coin-btn-sym').textContent;const mkLvl=(price)=>{if(!price||isNaN(price))return null;const p=parseFloat(price);return{price:p,pct:((p-entryPrice)/entryPrice*100).toFixed(2),label:'Manual'};};const t1=mkLvl(t1Price),t2=mkLvl(t2Price),sl=mkLvl(slPrice);let rr=null;if(t1&&sl){const rew=Math.abs(t1Price-entryPrice),risk=Math.abs(slPrice-entryPrice);rr=risk>0?(rew/risk).toFixed(1):null;}const entry={id:Date.now(),lockedAt:Date.now(),coin,sym,direction:dir,entry:entryPrice,tf:chartInterval,t1,t2,sl,rr,score:null,signals:null,manual:true,structure:ms?`${ms.structure.charAt(0).toUpperCase()+ms.structure.slice(1)}${ms.bos?' · BOS':''}` : '—',ob:{bos:ms?.bos?.price||null,bosDir:ms?.bos?.type||null,swingHigh:ms?.lastH?.price||null,swingLow:ms?.lastL?.price||null,vpoc:vp?.vpocPrice||null,vah:vp?.vahPrice||null,val:vp?.valPrice||null},atr:atrPct,macro:'—',outcome:null,exitPrice:null,exitPct:null,mfe:0,mae:0,resolvedAt:null};tradeLog.forEach(e=>{if(!e.outcome){e.outcome='EXPIRED';e.resolvedAt=Date.now();}});tradeLog.unshift(entry);if(tradeLog.length>100)tradeLog.pop();activeLogEntry=entry;saveTradeLog();updateLogButtonUI();if(logModalOpen)renderLogModal();}

on">🎯</span><div class="las-level-info"><span class="las-level-pct pos">${e.t2.pct>0?'+':''}${e.t2.pct}%</span><span class="las-level-px">${fmtP(e.t2.price)}</span><span class="las-level-lbl">TP2</span></div>${levelStatus(e.t2,false)}</div>`:''}${e.sl?`<div class="las-level-row"><span class="las-level-icon">🛡</span><div class="las-level-info"><span class="las-level-pct neg">${e.sl.pct>0?'+':''}${e.sl.pct}%</span><span class="las-level-px">${fmtP(e.sl.price)}</span><span class="las-level-lbl">Stop Loss</span></div>${levelStatus(e.sl,true)}</div>`:''}</div><div class="las-context"><div class="las-ctx-title">Market Context at Entry</div><div class="las-ctx-row"><span class="las-ctx-lbl">Structure</span><span class="las-ctx-val">${e.structure||'—'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">BOS</span><span class="las-ctx-val">${ob.bos?fmtP(ob.bos)+' ('+ob.bosDir+')':'—'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">Swing High</span><span class="las-ctx-val">${ob.swingHigh?fmtP(ob.swingHigh):'—'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">Swing Low</span><span class="las-ctx-val">${ob.swingLow?fmtP(ob.swingLow):'—'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">VPOC</span><span class="las-ctx-val">${ob.vpoc?fmtP(ob.vpoc):'—'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">VAH / VAL</span><span class="las-ctx-val">${ob.vah?fmtP(ob.vah)+' / '+fmtP(ob.val):'—'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">ATR</span><span class="las-ctx-val">${e.atr?.toFixed(2)}%/${e.tf}</span></div></div><div class="las-excursion"><div class="las-exc-title">Excursion Tracker</div><div class="las-exc-row"><span class="las-exc-lbl">MFE ▲</span><div class="las-exc-bar-wrap"><div class="las-exc-bar mfe" style="width:${Math.min(100,(e.mfe||0)/mfeMax*100)}%"></div></div><span class="las-exc-val mfe">+${(e.mfe||0).toFixed(2)}%</span></div><div class="las-exc-row"><span class="las-exc-lbl">M function renderLogHistory(){if(tradeLog.length===0)return'<div class="log-history-empty">No trades logged yet.</div>';const oLbl=o=>{if(!o)return'<span class="log-outcome-badge active">● ACTIVE</span>';if(o==='T2_HIT')return'<span class="log-outcome-badge t2">✓✓ T2 HIT</span>';if(o==='T1_HIT')return'<span class="log-outcome-badge t1">✓ T1 HIT</span>';if(o==='SL_HIT')return'<span class="log-outcome-badge sl">✗ SL HIT</span>';if(o==='MANUAL_CLOSE')return'<span class="log-outcome-badge closed">○ CLOSED</span>';return'<span class="log-outcome-badge exp">— EXPIRED</span>';};const rows=tradeLog.map((e,i)=>{const d=new Date(e.lockedAt),ts=`${d.getDate()}/${d.getMonth()+1} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`,isWin=e.outcome==='T1_HIT'||e.outcome==='T2_HIT',isLoss=e.outcome==='SL_HIT',pl=e.exitPct!=null?`<span class="log-pl ${e.exitPct>=0?'pos':'neg'}">${e.exitPct>=0?'+':''}${e.exitPct.toFixed(2)}%</span>`:'—';return`<tr class="${isWin?'win-row':isLoss?'loss-row':''}"><td style="color:var(--text3)">#${tradeLog.length-i}</td><td style="color:var(--text3)">${ts}</td><td style="font-weight:700;color:var(--text)">${e.coin}</td><td style="color:var(--text2)">${e.tf}</td><td class="log-td-dir ${e.direction.toLowerCase()}">${e.direction==='LONG'?'▲ LONG':'▼ SHORT'}</td><td>${fmtP(e.entry)}</td><td style="color:var(--green2)">${e.t1?(e.t1.pct>0?'+':'')+e.t1.pct+'%':'—'}</td><td style="color:var(--green2)">${e.t2?(e.t2.pct>0?'+':'')+e.t2.pct+'%':'—'}</td><td style="color:var(--red2)">${e.sl?(e.sl.pct>0?'+':'')+e.sl.pct+'%':'—'}</td><td style="color:var(--yellow2)">${e.rr?e.rr+':1':'—'}</td><td>${oLbl(e.outcome)}</td><td>${pl}</td></tr>`;}).join('');return`<table class="log-history-table"><thead><tr><th>#</th><th>Time</th><th>Coin</th><th>TF</th><th>Dir</th><th>Entry</th><th>TP</th><th>TP2</th><th>SL</th><th>R/R</th><th>Outcome</th><th>P/L</th></tr></thead><tbody>${rows}</tbody></table>`;}
function renderLogStats(){const resolved=tradeLog.filter(e=>e.outcome&&e.outcome!=='EXPIRED'&&e.outcome!=='MANUAL_CLOSE'),wins=resolved.filter(e=>e.outcome==='T1_HIT'||e.outcome==='T2_HIT'),losses=resolved.filter(e=>e.outcome==='SL_HIT'),total=resolved.length;if(total===0)return`<div class="log-stats-grid"><div class="log-stat-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text3)">No completed trades yet.</div></div>`;const wr=(wins.length/total*100).toFixed(1),avgWin=wins.length>0?(wins.reduce((s,e)=>s+(e.exitPct||0),0)/wins.length).toFixed(2):'0.00',avgLoss=losses.length>0?Math.abs(losses.reduce((s,e)=>s+(e.exitPct||0),0)/losses.length).toFixed(2):'0.00',allPL=resolved.filter(e=>e.exitPct!=null),totalPL=allPL.reduce((s,e)=>s+(e.exitPct||0),0).toFixed(2),best=allPL.length?Math.max(...allPL.map(e=>e.exitPct)).toFixed(2):'0.00',worst=allPL.length?Math.min(...allPL.map(e=>e.exitPct)).toFixed(2):'0.00',avgMFE=resolved.filter(e=>e.mfe>0).reduce((s,e)=>s+e.mfe,0)/Math.max(1,resolved.filter(e=>e.mfe>0).length),avgMAE=resolved.filter(e=>e.mae>0).reduce((s,e)=>s+e.mae,0)/Math.max(1,resolved.filter(e=>e.mae>0).length),byDir={LONG:{w:0,l:0},SHORT:{w:0,l:0}};resolved.forEach(e=>{const d=e.direction;if(!byDir[d])byDir[d]={w:0,l:0};if(e.outcome==='T1_HIT'||e.outcome==='T2_HIT')byDir[d].w++;else byDir[d].l++;});return`<div class="log-stats-grid"><div class="log-stat-card"><div class="log-stat-card-title">Win Rate</div><div class="log-stat-big ${parseFloat(wr)>=50?'green':'red'}">${wr}%</div><div class="log-stat-sub">${wins.length} wins · ${losses.length} losses · ${total} total</div></div><div class="log-stat-card"><div class="log-stat-card-title">Total P/L</div><div class="log-stat-big ${parseFloat(totalPL)>=0?'green':'red'}">${parseFloat(totalPL)>=0?'+':''}${totalPL}%</div><div class="log-stat-sub">Avg Win +${avgWin}% · Avg Loss -${avgLoss}%</div></div><div class="log-stat-card"><div class="log-stat-card-title">Best / Worst</div><div class="log-stat-big yellow">+${best}%</div><div class="log-stat-sub">Worst: ${worst}%</div></div><div class="log-stat-card"><div class="log-stat-card-title">Excursion</div><div class="log-stat-rows"><div class="log-stat-row"><span class="log-stat-row-lbl">Avg MFE</span><span class="log-stat-row-val" style="color:var(--green2)">+${avgMFE.toFixed(2)}%</span></div><div class="log-stat-row"><span class="log-stat-row-lbl">Avg MAE</span><span class="log-stat-row-val" style="color:var(--red2)">-${avgMAE.toFixed(2)}%</span></div><div class="log-stat-row"><span class="log-stat-row-lbl">MFE/MAE</span><span class="log-stat-row-val">${avgMAE>0?(avgMFE/avgMAE).toFixed(1)+'×':'—'}</span></div></div></div><div class="log-stat-card"><div class="log-stat-card-title">By Direction</div><div class="log-stat-rows"><div class="log-stat-row"><span class="log-stat-row-lbl" style="color:var(--green2)">▲ LONG</span><span class="log-stat-row-val">${byDir.LONG.w}/${byDir.LONG.w+byDir.LONG.l} (${byDir.LONG.w+byDir.LONG.l>0?Math.round(byDir.LONG.w/(byDir.LONG.w+byDir.LONG.l)*100)+'%':'—'})</span></div><div class="log-stat-row"><span class="log-stat-row-lbl" style="color:var(--red2)">▼ SHORT</span><span class="log-stat-row-val">${byDir.SHORT.w}/${byDir.SHORT.w+byDir.SHORT.l} (${byDir.SHORT.w+byDir.SHORT.l>0?Math.round(byDir.SHORT.w/(byDir.SHORT.w+byDir.SHORT.l)*100)+'%':'—'})</span></div></div></div><div class="log-stat-card"><div class="log-stat-card-title">Trade Count</div><div class="log-stat-big purple">${tradeLog.length}</div><div class="log-stat-sub">${tradeLog.filter(e=>!e.outcome).length} active</div></div></div>`;}

function renderStats(){const{bids,asks}=book;if(!bids.length||!asks.length)return;document.getElementById('cs-spread').textContent=fmtP(asks[0].price-bids[0].price);const cvd=calcNetCVD(),dEl=document.getElementById('cs-cvd');if(dEl){dEl.textContent=(cvd>=0?'+':'')+(cvd*100).toFixed(0)+'%';dEl.className='cstat-val '+(cvd>0.1?'bull':cvd<-0.1?'bear':'flat');}}

function drawChart(){
  const cv=document.getElementById('chart-cv'),body=document.getElementById('chart-body');
  const W=body.offsetWidth||940,H=body.offsetHeight||700;
  cv.width=W;cv.height=H;
  const ccv=document.getElementById('crosshair-cv');if(ccv){ccv.width=W;ccv.height=H;}
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#0b0f17';ctx.fillRect(0,0,W,H);
  if(!candles.length){ctx.fillStyle='#5e7082';ctx.font='13px monospace';ctx.textAlign='center';ctx.fillText('Loading chart…',W/2,H/2);return;}
  const PW=68,LW=68,TH=18,VH=Math.round(H*0.10),cW=W-PW-LW,lS=cW,lE=W-PW,cAH=H-TH-VH;
  const slotW=Math.max(4,cW/Math.min(candles.length,120)),numVis=Math.floor(cW/slotW),vis=candles.slice(-numVis),n=vis.length;
  if(!n)return;
  const bW=Math.max(1.5,slotW*0.65);
  let hi=-Infinity,lo=Infinity,mV=0;
  vis.forEach(c=>{if(c.h>hi)hi=c.h;if(c.l<lo)lo=c.l;if(c.v>mV)mV=c.v;});mV=mV||1;
  if(book.bids.length&&livePrice)[...book.bids,...book.asks].filter(o=>o.usd>=THRESHOLD).forEach(o=>{if(o.price>lo*.995&&o.price<hi*1.005){if(o.price>hi)hi=o.price;if(o.price<lo)lo=o.price;}});
  if(activeLogEntry&&!activeLogEntry.outcome){const at=activeLogEntry;[at.entry,at.t1?.price,at.t2?.price,at.sl?.price].forEach(p=>{if(p&&!isNaN(p)&&p>0){if(p>hi)hi=p;if(p<lo)lo=p;}});}
  if(tradeSetup){[tradeSetup.entry,tradeSetup.t1,tradeSetup.t2,tradeSetup.sl].forEach(p=>{if(p&&!isNaN(p)&&p>0){if(p>hi)hi=p;if(p<lo)lo=p;}});}
  const pad=(hi-lo)*.07;hi+=pad;lo-=pad;
  const pr=hi-lo||1,p2y=p=>((hi-p)/pr)*cAH;
  chartHi=hi;chartLo=lo;chartLayout={cAH,cW,lE,PW,slotW,bW,H};
  for(let i=0;i<=8;i++){const y=i*(cAH/8);ctx.strokeStyle=i===4?'#151e2d':'#0f1620';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();}
  drawVPOC(ctx,getVP(),p2y,cW,cAH);
  drawConfirmedSR(ctx,getSR(),p2y,cW,cAH);
  drawBOS(ctx,getMS(),p2y,cW,cAH);
  drawLiquidityZones(ctx,p2y,cW,cAH);
  vis.forEach((c,i)=>{const x=i*slotW+slotW/2,isUp=c.c2>=c.o,col=isUp?'#2ea06b':'#c93a3a',colL=isUp?'#3dd68c':'#f6465d';ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,slotW*.1);ctx.beginPath();ctx.moveTo(x,p2y(c.h));ctx.lineTo(x,p2y(c.l));ctx.stroke();const yT=p2y(Math.max(c.o,c.c2)),yB=p2y(Math.min(c.o,c.c2)),bh=Math.max(1.5,yB-yT);if(bW>=2){if(c.live){ctx.strokeStyle=colL;ctx.lineWidth=1;ctx.strokeRect(x-bW/2,yT,bW,bh);}else{ctx.fillStyle=col;ctx.fillRect(x-bW/2,yT,bW,bh);}}else{ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,yT);ctx.lineTo(x,yB);ctx.stroke();}const vh=(c.v/mV)*VH*.88;ctx.fillStyle=isUp?'rgba(46,160,107,.16)':'rgba(201,58,58,.16)';ctx.fillRect(x-bW/2,H-TH-vh,bW,vh);});
  drawOrderCircles(ctx,p2y,cW,cAH);
  if(livePrice){const y=p2y(livePrice);if(y>=0&&y<=cAH){ctx.strokeStyle=livePrice>=prevPrice?'rgba(46,160,107,.3)':'rgba(201,58,58,.28)';ctx.lineWidth=1;ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.setLineDash([]);}}
  drawActiveTrade(ctx,p2y,cW,cAH,lE,PW);
  ctx.fillStyle='#4a5a72';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('VOL',4,H-TH-2);
  const cWL=lE-lS;ctx.fillStyle='#0b0f17';ctx.fillRect(lS,0,cWL,H-TH);ctx.strokeStyle='#111925';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lS,0);ctx.lineTo(lS,H-TH);ctx.stroke();ctx.fillStyle='#4a5a72';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText('DEPTH',lS+cWL/2,10);
  if(book.bids.length){const allO=[...book.bids,...book.asks];let maxUsd=0;allO.forEach(o=>{if(o.usd>maxUsd)maxUsd=o.usd;});maxUsd=maxUsd||1;const midX=lS+cWL/2;ctx.strokeStyle='#111925';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(midX,14);ctx.lineTo(midX,cAH-2);ctx.stroke();allO.forEach(o=>{const y=p2y(o.price);if(y<14||y>cAH-2)return;const isBid=o.price<(livePrice||0),frac=o.usd/maxUsd,hM=(cWL/2)-3,barW=Math.max(1,frac*hM),al=0.12+frac*0.65,isWall=o.usd>=THRESHOLD;ctx.fillStyle=isBid?`rgba(46,160,107,${al})`:`rgba(201,58,58,${al})`;if(isBid)ctx.fillRect(midX,y-1,barW,2);else ctx.fillRect(midX-barW,y-1,barW,2);if(isWall){ctx.strokeStyle=isBid?'rgba(46,160,107,.7)':'rgba(201,58,58,.65)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(lS+1,y);ctx.lineTo(lE-1,y);ctx.stroke();ctx.fillStyle=isBid?'rgba(46,160,107,.75)':'rgba(201,58,58,.72)';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(fmtV(o.usd),lS+cWL/2,y-3);}});if(livePrice){const y=p2y(livePrice);if(y>=14&&y<=cAH){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lS,y);ctx.lineTo(lE,y);ctx.stroke();}}}
  ctx.fillStyle='#0b0f17';ctx.fillRect(lE,0,PW,H);ctx.strokeStyle='#1e2d40';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lE,0);ctx.lineTo(lE,H);ctx.stroke();
  ctx.fillStyle='#7a8fa4';ctx.font='9px monospace';ctx.textAlign='left';
  for(let i=0;i<=9;i++){const price=hi-(pr/9)*i,y=p2y(price);if(y<0||y>cAH)continue;ctx.strokeStyle='#0c1218';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.fillText(fPS(price),lE+5,y+3);}
  if(livePrice){const y=p2y(livePrice);if(y>=0&&y<=cAH){const col=livePrice>=prevPrice?'#2ea06b':'#c93a3a';ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(lE+1,y-9,PW-3,18,3):ctx.rect(lE+1,y-9,PW-3,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText(fPS(livePrice),lE+5,y+3.5);}}
  drawCandleTimer(ctx,cW,cAH,lE,PW,H,TH);
  ctx.fillStyle='#6b7d92';ctx.font='8px monospace';ctx.textAlign='center';
  const lbE=Math.max(1,Math.floor(n/8));
  vis.forEach((c,i)=>{if(i%lbE!==0)return;const x=i*slotW+slotW/2,d=new Date(c.t);ctx.fillText(`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`,x,H-4);});
  const ld=[{col:'rgba(240,185,11,.8)',dash:true,lbl:'VPOC'},{col:'rgba(46,160,107,.75)',lbl:'Support'},{col:'rgba(201,58,58,.75)',lbl:'Resistance'},{col:'rgba(61,214,140,.7)',dash:true,lbl:'BSL'},{col:'rgba(246,70,93,.7)',dash:true,lbl:'SSL'},{col:'rgba(168,85,247,.75)',dash:true,lbl:'EQL'},{col:'rgba(61,214,140,.65)',lbl:'● Bid'},{col:'rgba(246,70,93,.65)',lbl:'● Ask'}];
  let lx=20;ctx.font='8px monospace';ctx.textAlign='left';ld.forEach(item=>{ctx.strokeStyle=item.col;ctx.lineWidth=1.5;ctx.setLineDash(item.dash?[5,5]:[]);ctx.beginPath();ctx.moveTo(lx,cAH-6);ctx.lineTo(lx+18,cAH-6);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=item.col;ctx.fillText(item.lbl,lx+22,cAH-2);lx+=ctx.measureText(item.lbl).width+42;});
  redrawCrosshairCanvas();
}

function changeInterval(newTF){
  if(newTF===chartInterval)return;
  if(wsM&&wsM.readyState===WebSocket.OPEN){wsM.send(JSON.stringify({method:'UNSUBSCRIBE',params:[`${sym}@kline_${chartInterval}`],id:10}));wsM.send(JSON.stringify({method:'SUBSCRIBE',params:[`${sym}@kline_${newTF}`],id:11}));}
  chartInterval=newTF;candles=[];clearAnalysisCache();
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===newTF));
  loadCandles();startCandleTimer();
}

function resetAndConnect(){
  livePrice=0;prevPrice=0;book={bids:[],asks:[]};prevWalls={bids:{},asks:{}};hunts=[];tradeBuffer=[];wallTimestamps={};obSnaps=[];clearAnalysisCache();
  const lp=document.getElementById('live-price');if(lp)lp.textContent='Loading…';
  ['cs-spread','cs-cvd'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='—';});
  const lz=document.getElementById('liq-zones-list');if(lz)lz.innerHTML='<div class="sig-empty">Loading…</div>';
  const ma=document.getElementById('manual-entry-area');if(ma&&!activeLogEntry&&!manualEntryDir){ma.innerHTML=`<div class="manual-trade-btns"><button class="manual-long-btn" id="manual-long-btn">▲ LONG</button><button class="manual-short-btn" id="manual-short-btn">▼ SHORT</button></div>`;document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));}
  connect();startSnapshotScheduler();
}

function fmtP(p){if(!p&&p!==0)return'—';if(p>=1000)return p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=1)return p.toFixed(4);return p.toFixed(6);}
function fPS(p){if(!p)return'0';if(p>=1000)return(p/1000).toFixed(1)+'k';if(p>=1)return p.toFixed(2);return p.toFixed(4);}
function fmtV(v){const cs=currSym;if(v>=1e9)return cs+(v/1e9).toFixed(2)+'B';if(v>=1e6)return cs+(v/1e6).toFixed(2)+'M';if(v>=1e3)return cs+(v/1e3).toFixed(1)+'K';return cs+v.toFixed(0);}

// ── Event listeners ───────────────────────────────────────────
document.getElementById('thr-inp').addEventListener('input',function(){const v=parseInt(this.value);if(!isNaN(v)&&v>=100){if(isAutoThreshold){isAutoThreshold=false;updateAutoBtn(false);}THRESHOLD=v;prevWalls={bids:{},asks:{}};wallTimestamps={};renderStats();drawChart();}});
document.getElementById('auto-thr-btn').addEventListener('click',()=>{isAutoThreshold=true;updateAutoBtn(true);needsAutoCalc=true;if(book.bids.length){calcAutoThreshold();renderStats();drawChart();}});
document.getElementById('bubble-btn').addEventListener('click',toggleBubbleMode);
document.querySelectorAll('.tf-btn').forEach(btn=>btn.addEventListener('click',()=>changeInterval(btn.dataset.tf)));
document.getElementById('log-btn').addEventListener('click',()=>{logModalOpen?closeLogModal():openLogModal();});
document.getElementById('log-close-btn').addEventListener('click',closeLogModal);
document.getElementById('log-clear-btn').addEventListener('click',()=>{if(confirm('Clear all trade log entries?')){tradeLog=[];activeLogEntry=null;saveTradeLog();updateLogButtonUI();renderLogModal();}});

document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));
document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));
document.getElementById('mobile-panel-btn').addEventListener('click',openMobilePanel);
document.getElementById('panel-backdrop').addEventListener('click',closeMobilePanel);
document.getElementById('panel-handle').addEventListener('click',closeMobilePanel);
window.addEventListener('resize',()=>{drawChart();if(window.innerWidth>768)closeMobilePanel();});

loadTradeLog();
initChartInteraction();
startCandleTimer();
loadAllBinancePairs().then(()=>{resetAndConnect();refreshAllPrices();});
