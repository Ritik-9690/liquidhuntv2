<html data-type="html" data-identifier="dc3b6f66-93c0-4a98-8323-4a2388a7b419" data-title="Liquidity Hunter" data-version="61"><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
<style>
:root{
  --bg:#0a0e1a;--surface:#0e1424;--surface2:#131b30;--surface3:#1a2440;
  --border:#1f2b47;--border2:#2b3a5c;
  --text:#e4eaf2;--text2:#96a6b8;--text3:#5e7082;
  --green:#14b88f;--green2:#2de0b8;--red:#e0405f;--red2:#ff5d7e;
  --yellow:#e8a817;--yellow2:#f0b90b;--purple:#a855f7;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-data:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --trans:.2s cubic-bezier(.4,0,.2,1);
  --sheet-trans:.32s cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4a62}

body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-data);font-size:12px;
  width:100%;height:100vh;height:100dvh;
  overflow:hidden;display:flex;flex-direction:column
}

/* ── HEADER ──────────────────────────────────── */
#hdr{
  height:54px;flex-shrink:0;
  background:linear-gradient(180deg,#171f2e 0%,var(--surface2) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  position:relative;z-index:20
}
.logo{
  font-size:15px;font-weight:700;color:var(--yellow2);
  letter-spacing:1.5px;white-space:nowrap;
  text-shadow:0 0 28px rgba(240,185,11,.4),0 0 56px rgba(240,185,11,.15)
}
.hdr-sep{width:1px;height:26px;background:var(--border2);flex-shrink:0}
.price-block{display:flex;flex-direction:column;gap:2px}
.price-top{display:flex;align-items:center;gap:8px}
#pair-sym{font-family:var(--font-ui);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
#exch-badge{font-family:var(--font-ui);font-size:9px;padding:1px 6px;border-radius:10px;font-weight:600;background:rgba(255,93,126,.1);color:var(--red2);border:1px solid rgba(255,93,126,.2)}
#live-price{font-size:22px;font-weight:700;color:var(--green2);transition:color .25s;line-height:1}
#live-price.dn{color:var(--red2)}
.log-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--surface3);border:1px solid var(--border2);color:var(--text2);
  padding:6px 12px;border-radius:8px;font-family:var(--font-ui);font-size:11px;
  cursor:pointer;transition:var(--trans);white-space:nowrap;flex-shrink:0
}
.log-btn:hover{border-color:var(--purple);color:var(--purple);background:rgba(167,139,250,.07);box-shadow:0 0 12px rgba(167,139,250,.15)}
.log-btn.has-active{border-color:rgba(45,224,184,.4);color:var(--green2);animation:tradeGlow 2s infinite}
@keyframes tradeGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px rgba(45,224,184,.25)}}
.log-count{font-size:9px;font-weight:700;background:var(--purple);color:#fff;padding:1px 5px;border-radius:8px;display:none}
.log-count.show{display:inline}
.thr-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.thr-wrap label{font-family:var(--font-ui);font-size:11px;color:var(--text2);white-space:nowrap}
#thr-inp{
  background:var(--surface3);border:1px solid var(--border2);color:var(--yellow2);
  padding:5px 7px;border-radius:6px;font-family:var(--font-data);font-size:11px;
  width:80px;outline:none;transition:var(--trans)
}
#thr-inp:focus{border-color:rgba(240,185,11,.5);box-shadow:0 0 0 2px rgba(240,185,11,.08)}
#auto-thr-btn{font-family:var(--font-ui);font-size:10px;padding:4px 10px;border-radius:5px;cursor:pointer;font-weight:600;transition:var(--trans);white-space:nowrap;line-height:1.4}
#auto-thr-btn.auto{background:rgba(20,184,143,.12);border:1px solid rgba(20,184,143,.3);color:var(--green2)}
#auto-thr-btn.auto:hover{background:rgba(20,184,143,.22);box-shadow:0 0 8px rgba(20,184,143,.2)}
#auto-thr-btn.manual{background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.25);color:var(--yellow2)}
.conn-wrap{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
#conn-txt{font-family:var(--font-ui);font-size:11px;color:var(--text2)}
#conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red2);flex-shrink:0;transition:background .3s}
#conn-dot.on{background:#14b88f;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(20,184,143,.5)}60%{box-shadow:0 0 0 5px rgba(20,184,143,0)}}

/* ── COIN DROPDOWN ───────────────────────────── */
.coin-dropdown{position:relative;flex-shrink:0}
.coin-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--surface3);border:1px solid var(--border2);
  padding:6px 12px;border-radius:8px;cursor:pointer;
  transition:var(--trans);min-width:140px;justify-content:space-between
}
.coin-btn:hover{border-color:rgba(240,185,11,.45);box-shadow:0 0 12px rgba(240,185,11,.08)}
.coin-btn.open{border-color:rgba(240,185,11,.6);background:rgba(240,185,11,.05);box-shadow:0 0 16px rgba(240,185,11,.12)}
.coin-btn-info{display:flex;flex-direction:column;gap:2px}
.coin-btn-sym{font-size:13px;font-weight:700;color:var(--yellow2);line-height:1}
.coin-btn-px{font-family:var(--font-ui);font-size:10px;color:var(--text2)}
.coin-btn-arrow{font-size:11px;color:var(--text3);transition:transform .22s}
.coin-btn.open .coin-btn-arrow{transform:rotate(180deg)}
.coin-panel{
  position:absolute;top:calc(100% + 8px);left:0;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:14px;padding:10px;z-index:500;display:none;
  width:500px;
  box-shadow:0 24px 64px rgba(0,0,0,.96),0 0 0 1px rgba(255,255,255,.03);
  flex-direction:column;
  animation:panelIn .18s ease
}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.coin-panel.open{display:flex}
.coin-panel-hdr{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;flex-shrink:0}
.coin-panel-title{font-family:var(--font-ui);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.coin-panel-count{font-family:var(--font-ui);font-size:10px;color:var(--text3)}
.coin-search-wrap{position:relative;margin-bottom:8px;flex-shrink:0}
#coin-search{
  width:100%;background:var(--surface3);border:1px solid var(--border2);
  color:var(--text);padding:7px 10px 7px 30px;border-radius:8px;
  font-family:var(--font-ui);font-size:11px;outline:none;transition:var(--trans)
}
#coin-search:focus{border-color:rgba(240,185,11,.4);box-shadow:0 0 0 2px rgba(240,185,11,.08)}
.coin-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text3);pointer-events:none}
.coin-loading{font-family:var(--font-ui);font-size:11px;color:var(--text3);text-align:center;padding:20px;animation:fadeP 1.5s infinite}
@keyframes fadeP{0%,100%{opacity:1}50%{opacity:.3}}
.coin-grid-scroll{overflow-y:auto;max-height:300px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.coin-item{
  background:rgba(255,255,255,.025);border:1px solid var(--border);
  border-radius:8px;padding:7px 3px 6px;cursor:pointer;transition:var(--trans);
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center
}
.coin-item:hover{border-color:rgba(240,185,11,.5);background:rgba(240,185,11,.07);transform:translateY(-1px);box-shadow:0 2px 8px rgba(240,185,11,.12)}
.coin-item.active{border-color:rgba(45,224,184,.6);background:rgba(45,224,184,.08);box-shadow:0 0 10px rgba(45,224,184,.1)}
.coin-item-sym{font-size:9px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.coin-item-vol{font-family:var(--font-ui);font-size:7px;color:var(--text3);height:9px}
.coin-item.active .coin-item-sym{color:var(--green2)}
.coin-item.active .coin-item-vol{color:rgba(45,224,184,.5)}

/* ── MAIN LAYOUT ─────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#chart-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}

/* ── CHART TOP BAR ───────────────────────────── */
#chart-top{
  height:40px;flex-shrink:0;
  background:linear-gradient(180deg,var(--surface2) 0%,rgba(18,25,38,.97) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px
}
.cstat{display:flex;flex-direction:column;align-items:center;min-width:52px;gap:1px}
.cstat-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.cstat-val{font-family:var(--font-data);font-size:12px;font-weight:600;color:var(--text)}
.cstat-sep{width:1px;height:20px;background:var(--border2);flex-shrink:0}
#cs-cvd.bull{color:var(--green2)}#cs-cvd.bear{color:var(--red2)}#cs-cvd.flat{color:var(--text2)}
.candle-timer-wrap{display:flex;flex-direction:column;align-items:center;min-width:60px;gap:1px}
.candle-timer-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
#cs-candle{font-family:var(--font-data);font-size:14px;font-weight:700;color:var(--green2);letter-spacing:.5px;transition:color .3s;line-height:1}
#cs-candle.warn{color:var(--yellow2)}
#cs-candle.urgent{color:var(--red2);animation:timerPulse .5s infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.4}}
.candle-timer-outer{display:flex;align-items:center;gap:8px}
.candle-progress-bar{width:48px;height:4px;background:var(--border2);border-radius:2px;overflow:hidden}
.candle-progress-fill{height:100%;border-radius:2px;transition:width .9s linear,background .3s}
.tf-grp{display:flex;gap:6px;align-items:center}
.tf-btn{
  background:transparent;border:1px solid transparent;color:var(--text2);
  padding:4px 10px;border-radius:5px;font-family:var(--font-ui);font-size:11px;
  font-weight:500;cursor:pointer;transition:var(--trans);white-space:nowrap
}
.tf-sel{
  background:rgba(240,185,11,.12);border:1px solid rgba(240,185,11,.32);color:var(--yellow2);
  padding:4px 8px;border-radius:5px;font-family:var(--font-ui);font-size:12px;font-weight:700;
  cursor:pointer;outline:none;min-width:84px
}
.tf-sel option,.tf-sel optgroup{background:#121a26;color:#e6edf6;font-weight:500}
#bubble-btn{
  display:flex;align-items:center;gap:5px;background:var(--surface3);
  border:1px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:6px;
  font-family:var(--font-ui);font-size:10px;font-weight:600;cursor:pointer;
  transition:var(--trans);white-space:nowrap;letter-spacing:.3px;margin-left:4px
}
#bubble-btn.live{border-color:rgba(45,224,184,.35);color:var(--green2);background:rgba(45,224,184,.07)}
#bubble-btn.fade{border-color:rgba(240,185,11,.35);color:var(--yellow2);background:rgba(240,185,11,.07)}
.bubble-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#bubble-btn.live .bubble-dot{background:var(--green2)}
#bubble-btn.fade .bubble-dot{background:var(--yellow2);animation:bubPulse 1.5s infinite}
@keyframes bubPulse{0%,100%{opacity:1}50%{opacity:.4}}
#chart-loading{font-family:var(--font-ui);font-size:10px;color:var(--text3);margin-left:2px}
#mobile-panel-btn{display:none}
#quick-bar{display:none}

/* ── CHART BODY ──────────────────────────────── */
#chart-body{flex:1;position:relative;overflow:hidden;cursor:crosshair;touch-action:none}
#chart-cv{display:block;width:100%;height:100%}
#jump-latest{position:absolute;right:76px;bottom:34px;display:none;padding:7px 12px;border-radius:999px;border:1px solid rgba(240,185,11,.4);background:rgba(15,21,32,.92);color:var(--yellow2);font-family:var(--font-ui);font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:5}
#jump-latest.show{display:block}
#crosshair-cv{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* ── SIGNALS PANEL ───────────────────────────── */
#signals-panel{
  width:262px;min-width:262px;border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
  background:var(--surface);flex-shrink:0
}
.panel-handle{display:none}
.sig-section{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sig-section:last-child{border-bottom:none;flex:1}
.sig-section-hdr{
  font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px
}
.sig-section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.sig-empty{font-family:var(--font-ui);font-size:11px;color:var(--text3);padding:4px 0;font-style:italic}
.liq-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.liq-row:last-child{border-bottom:none}
.liq-badge{font-family:var(--font-ui);font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;letter-spacing:.2px}
.liq-badge.bsl{background:rgba(45,224,184,.1);color:var(--green2);border:1px solid rgba(45,224,184,.22)}
.liq-badge.ssl{background:rgba(255,93,126,.08);color:var(--red2);border:1px solid rgba(255,93,126,.18)}
.liq-badge.eq{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.22)}
.liq-price{color:var(--text);font-weight:600;flex:1;font-size:11px}
.liq-dist{font-family:var(--font-ui);font-weight:700;font-size:11px;white-space:nowrap}
.liq-dist.up{color:var(--green2)}.liq-dist.dn{color:var(--red2)}
.liq-sep{height:1px;background:var(--border);margin:5px 0}
.sig-ctx-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.sig-ctx-item:last-child{border-bottom:none}
.sig-ctx-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.sig-ctx-val{font-family:var(--font-data);color:var(--text2);font-weight:600;font-size:11px;text-align:right}

/* ── WALL BIAS ───────────────────────────────── */
.wall-bias-item{padding:7px 0 3px;border-top:1px solid rgba(255,255,255,.03);margin-top:3px}
.wall-bias-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.wall-bias-status{font-family:var(--font-data);font-weight:700;font-size:11px;color:var(--text2)}
.wall-bias-bar-outer{height:6px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;margin-bottom:5px}
.wall-bias-bar-bid{height:100%;background:var(--green2);transition:width .6s ease}
.wall-bias-bar-ask{height:100%;background:var(--red2);transition:width .6s ease}
.wall-bias-amounts{display:flex;justify-content:space-between}
.wall-bias-amt{font-family:var(--font-ui);font-size:9px;font-weight:600}

/* ── TRADE BUTTONS ───────────────────────────── */
.manual-trade-btns{display:flex;gap:8px}
.manual-long-btn{
  flex:1;background:rgba(20,184,143,.1);border:1px solid rgba(20,184,143,.26);
  color:var(--green2);padding:14px 4px;border-radius:10px;
  font-family:var(--font-ui);font-size:13px;cursor:pointer;font-weight:700;
  transition:var(--trans);text-align:center;min-height:48px
}
.manual-long-btn:hover{background:rgba(20,184,143,.2);border-color:rgba(20,184,143,.55);transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,184,143,.2)}
.manual-short-btn{
  flex:1;background:rgba(224,64,95,.08);border:1px solid rgba(224,64,95,.22);
  color:var(--red2);padding:14px 4px;border-radius:10px;
  font-family:var(--font-ui);font-size:13px;cursor:pointer;font-weight:700;
  transition:var(--trans);text-align:center;min-height:48px
}
.manual-short-btn:hover{background:rgba(224,64,95,.18);border-color:rgba(224,64,95,.48);transform:translateY(-2px);box-shadow:0 6px 20px rgba(224,64,95,.2)}

/* ── ENTRY FORM ──────────────────────────────── */
.entry-form{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.ef-dir{font-family:var(--font-ui);font-size:14px;font-weight:700;text-align:center;padding:9px;border-radius:8px;margin-bottom:10px}
.ef-dir.long{background:rgba(20,184,143,.12);color:var(--green2);border:1px solid rgba(20,184,143,.28)}
.ef-dir.short{background:rgba(224,64,95,.1);color:var(--red2);border:1px solid rgba(224,64,95,.25)}
.ef-drag-hint{font-family:var(--font-ui);font-size:10px;color:var(--text3);text-align:center;margin-bottom:10px;padding:4px 8px;background:rgba(240,185,11,.05);border-radius:5px;border:1px solid rgba(240,185,11,.12)}
.ef-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ef-lbl{font-family:var(--font-ui);font-size:10px;font-weight:600;width:40px;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px}
.ef-lbl.entry-lbl{color:var(--yellow2)}.ef-lbl.tp-lbl{color:var(--green2)}.ef-lbl.sl-lbl{color:var(--red2)}.ef-lbl.tp2-lbl{color:rgba(45,224,184,.6)}
.ef-inp{
  flex:1;background:var(--surface3);border:1px solid var(--border2);color:var(--text);
  padding:7px 8px;border-radius:7px;font-family:var(--font-data);font-size:12px;
  outline:none;width:100%;transition:var(--trans);min-height:36px
}
.ef-inp:focus{border-color:rgba(240,185,11,.6);box-shadow:0 0 0 2px rgba(240,185,11,.1)}
.ef-inp.tp-inp:focus{border-color:rgba(45,224,184,.6);box-shadow:0 0 0 2px rgba(45,224,184,.08)}
.ef-inp.sl-inp:focus{border-color:rgba(255,93,126,.6);box-shadow:0 0 0 2px rgba(255,93,126,.08)}
.ef-inp.err{border-color:var(--red2)!important;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ef-rr-display{font-family:var(--font-data);font-size:13px;font-weight:700;text-align:center;padding:6px 0 5px;color:var(--yellow2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:6px 0}
.ef-btns{display:flex;gap:6px;margin-top:8px}
.ef-confirm{flex:1;background:rgba(20,184,143,.12);border:1px solid rgba(20,184,143,.3);color:var(--green2);padding:10px 4px;border-radius:7px;font-family:var(--font-ui);font-size:12px;cursor:pointer;font-weight:700;transition:var(--trans);min-height:40px}
.ef-confirm:hover{background:rgba(20,184,143,.24);box-shadow:0 2px 12px rgba(20,184,143,.2)}
.ef-cancel{background:transparent;border:1px solid var(--border2);color:var(--text3);padding:10px 12px;border-radius:7px;font-family:var(--font-ui);font-size:13px;cursor:pointer;transition:var(--trans);min-height:40px}
.ef-cancel:hover{color:var(--red2);border-color:rgba(255,93,126,.3)}

/* ── ACTIVE TRADE CARD ───────────────────────── */
.active-trade-card{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.atc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.atc-dir{font-family:var(--font-ui);font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.atc-dir.long{background:rgba(20,184,143,.12);color:var(--green2);border:1px solid rgba(20,184,143,.25)}
.atc-dir.short{background:rgba(224,64,95,.1);color:var(--red2);border:1px solid rgba(224,64,95,.22)}
.atc-pnl{font-family:var(--font-data);font-size:20px;font-weight:700;line-height:1}
.atc-entry-line{font-family:var(--font-ui);font-size:10px;color:var(--text3);margin-bottom:9px;margin-top:2px}
.atc-hint{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-align:center;padding:3px 0;margin-bottom:6px;opacity:.7}
.atc-lvl-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.atc-lvl-row:last-of-type{border-bottom:none;margin-bottom:9px}
.atc-lvl-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px}
.atc-lvl-val{font-family:var(--font-data);font-weight:600;color:var(--text2);font-size:11px}
.atc-close{width:100%;background:transparent;border:1px solid rgba(255,93,126,.25);color:rgba(255,93,126,.65);padding:9px;border-radius:7px;font-family:var(--font-ui);font-size:11px;cursor:pointer;transition:var(--trans);font-weight:500;min-height:40px}
.atc-close:hover{border-color:var(--red2);color:var(--red2);background:rgba(255,93,126,.07)}

/* ── PANEL BACKDROP ──────────────────────────── */
#panel-backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);z-index:350;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)
}
#panel-backdrop.show{display:block}

/* ── LOG MODAL ───────────────────────────────── */
#log-modal{position:fixed;inset:0;z-index:600;display:none;background:rgba(0,0,0,.82);align-items:center;justify-content:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#log-modal.open{display:flex}
#log-panel{
  background:var(--surface);border:1px solid var(--border2);border-radius:18px;
  width:1100px;max-height:780px;display:flex;flex-direction:column;
  box-shadow:0 40px 100px rgba(0,0,0,.98),0 0 0 1px rgba(255,255,255,.03);
  overflow:hidden;animation:logIn .28s cubic-bezier(.34,1.56,.64,1)
}
@keyframes logIn{from{transform:scale(.95) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.log-panel-hdr{height:54px;background:linear-gradient(180deg,#171f2e,var(--surface2));border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.log-title{font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--text);letter-spacing:.5px}
.log-summary-pills{display:flex;gap:6px;margin-left:4px}
.log-summary-pill{font-family:var(--font-ui);font-size:10px;padding:3px 10px;border-radius:10px;font-weight:600;white-space:nowrap}
.log-summary-pill.win{background:rgba(20,184,143,.12);color:var(--green2);border:1px solid rgba(20,184,143,.25)}
.log-summary-pill.loss{background:rgba(224,64,95,.1);color:var(--red2);border:1px solid rgba(224,64,95,.2)}
.log-summary-pill.rate{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.log-panel-hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.log-clear-btn{background:transparent;border:1px solid rgba(255,93,126,.28);color:rgba(255,93,126,.6);padding:5px 12px;border-radius:6px;font-family:var(--font-ui);font-size:10px;cursor:pointer;transition:var(--trans);font-weight:500}
.log-clear-btn:hover{border-color:var(--red2);color:var(--red2);background:rgba(255,93,126,.05)}
.log-close-btn{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1;transition:color .15s;padding:0 4px;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.log-close-btn:hover{color:var(--red2)}
.log-tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0}
.log-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text2);padding:11px 22px;font-family:var(--font-ui);font-size:11px;font-weight:600;cursor:pointer;transition:var(--trans);letter-spacing:.4px;text-transform:uppercase;min-height:44px}
.log-tab:hover{color:var(--text);background:rgba(255,255,255,.02)}
.log-tab.active{color:var(--yellow2);border-bottom-color:var(--yellow2)}
.log-content{flex:1;overflow-y:auto;min-height:0}
.log-active-empty{padding:48px;text-align:center;color:var(--text3);font-family:var(--font-ui);font-size:12px;line-height:2.2}
.log-active-setup{padding:18px 20px}
.las-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.las-dir-badge{font-family:var(--font-ui);font-size:14px;font-weight:700;padding:6px 14px;border-radius:8px}
.las-dir-badge.long{background:rgba(20,184,143,.15);color:var(--green2);border:1px solid rgba(20,184,143,.3)}
.las-dir-badge.short{background:rgba(224,64,95,.12);color:var(--red2);border:1px solid rgba(224,64,95,.28)}
.las-coin{font-size:18px;font-weight:700;color:var(--text)}
.las-meta{font-family:var(--font-ui);font-size:11px;color:var(--text3)}
.las-score{font-family:var(--font-ui);font-size:10px;background:rgba(45,224,184,.1);color:var(--green2);border:1px solid rgba(45,224,184,.22);padding:2px 9px;border-radius:10px;font-weight:700;margin-left:auto}
.las-age{font-family:var(--font-ui);font-size:11px;color:var(--text3)}
.las-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.las-levels,.las-context,.las-excursion{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px}
.las-excursion{grid-column:1/-1}
.las-levels-title,.las-ctx-title,.las-exc-title{font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.las-level-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.las-level-row:last-child{border-bottom:none}
.las-level-icon{font-size:12px;width:14px;text-align:center}
.las-level-info{flex:1}
.las-level-pct{font-family:var(--font-data);font-size:16px;font-weight:700;display:block;line-height:1.1}
.las-level-pct.pos{color:var(--green2)}.las-level-pct.neg{color:var(--red2)}
.las-level-px{font-family:var(--font-data);font-size:10px;color:var(--text2)}
.las-level-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);margin-top:1px}
.las-level-status{font-family:var(--font-ui);font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px}
.las-level-status.hit{background:rgba(20,184,143,.15);color:var(--green2)}
.las-level-status.sl-hit{background:rgba(224,64,95,.1);color:var(--red2)}
.las-level-status.watching{background:rgba(125,136,152,.07);color:var(--text3)}
.las-ctx-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.03)}
.las-ctx-row:last-child{border-bottom:none}
.las-ctx-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.las-ctx-val{font-family:var(--font-data);color:var(--text2);font-weight:600;font-size:11px}
.las-ctx-val.bull{color:var(--green2)}.las-ctx-val.bear{color:var(--red2)}
.las-exc-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.las-exc-row:last-child{margin-bottom:0}
.las-exc-lbl{font-family:var(--font-ui);font-size:10px;color:var(--text3);font-weight:500;width:45px;text-transform:uppercase}
.las-exc-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.las-exc-bar{height:100%;border-radius:4px;transition:width .5s ease}
.las-exc-bar.mfe{background:linear-gradient(90deg,var(--green2),rgba(45,224,184,.4))}
.las-exc-bar.mae{background:linear-gradient(90deg,var(--red2),rgba(255,93,126,.4))}
.las-exc-val{font-family:var(--font-data);font-size:11px;font-weight:700;width:50px;text-align:right}
.las-exc-val.mfe{color:var(--green2)}.las-exc-val.mae{color:var(--red2)}
.log-history-empty{padding:48px;text-align:center;color:var(--text3);font-family:var(--font-ui);font-size:12px;line-height:2}
.log-history-table{width:100%;border-collapse:collapse}
.log-history-table th{font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:2px solid var(--border);background:var(--surface2);text-align:left;position:sticky;top:0;z-index:1}
.log-history-table td{padding:9px 12px;font-size:11px;color:var(--text2);border-bottom:1px solid rgba(30,45,64,.7);vertical-align:middle}
.log-history-table tr:hover td{background:rgba(255,255,255,.02)}
.log-history-table tr.win-row td{background:rgba(20,184,143,.025)}
.log-history-table tr.loss-row td{background:rgba(224,64,95,.025)}
.log-td-dir{font-family:var(--font-ui);font-weight:700;white-space:nowrap}
.log-td-dir.long{color:var(--green2)}.log-td-dir.short{color:var(--red2)}
.log-outcome-badge{font-family:var(--font-ui);font-size:10px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.log-outcome-badge.t2{background:rgba(45,224,184,.15);color:var(--green2);border:1px solid rgba(45,224,184,.28)}
.log-outcome-badge.t1{background:rgba(20,184,143,.12);color:var(--green2);border:1px solid rgba(20,184,143,.22)}
.log-outcome-badge.sl{background:rgba(255,93,126,.1);color:var(--red2);border:1px solid rgba(255,93,126,.2)}
.log-outcome-badge.exp{background:rgba(125,136,152,.08);color:var(--text3);border:1px solid rgba(125,136,152,.18)}
.log-outcome-badge.closed{background:rgba(125,136,152,.08);color:var(--text2);border:1px solid rgba(125,136,152,.22)}
.log-outcome-badge.active{background:rgba(45,224,184,.1);color:var(--green2);border:1px solid rgba(45,224,184,.22);animation:blinkA 2s infinite}
@keyframes blinkA{0%,100%{opacity:1}50%{opacity:.5}}
.log-pl{font-family:var(--font-data);font-weight:700;font-size:11px}
.log-pl.pos{color:var(--green2)}.log-pl.neg{color:var(--red2)}
.log-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}
.log-stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px}
.log-stat-card-title{font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}
.log-stat-big{font-family:var(--font-data);font-size:32px;font-weight:700;line-height:1;margin-bottom:4px}
.log-stat-big.green{color:var(--green2)}.log-stat-big.red{color:var(--red2)}.log-stat-big.yellow{color:var(--yellow2)}.log-stat-big.purple{color:var(--purple)}
.log-stat-sub{font-family:var(--font-ui);font-size:11px;color:var(--text3)}
.log-stat-rows{display:flex;flex-direction:column;gap:6px}
.log-stat-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:11px}
.log-stat-row:last-child{border-bottom:none}
.log-stat-row-lbl{font-family:var(--font-ui);color:var(--text3)}
.log-stat-row-val{font-family:var(--font-data);font-weight:700;color:var(--text2)}

/* ── MOBILE ──────────────────────────────────── */
@media(max-width:768px){
  body{font-size:11px}

  #hdr{
    height:auto;min-height:52px;
    flex-wrap:wrap;padding:8px 12px;gap:6px;
    box-shadow:0 2px 14px rgba(0,0,0,.35)
  }
  .logo{font-size:13px;letter-spacing:1px}
  .hdr-sep{display:none}
  .coin-dropdown{order:10;flex:1;min-width:120px;position:static}
  .coin-btn{min-width:unset;width:100%}
  .price-block{order:1}
  #live-price{font-size:17px}
  .log-btn{order:11;padding:7px 10px}
  .thr-wrap{order:12}
  .thr-wrap label{display:none}
  #thr-inp{width:62px}
  #auto-thr-btn{padding:5px 8px;font-size:9px}
  .conn-wrap{order:2;margin-left:0}
  #conn-txt{display:none}

  .coin-panel{
    position:fixed;top:58px;left:10px;right:10px;
    width:auto;max-height:calc(100dvh - 78px);
    border-radius:14px
  }
  .coin-grid-scroll{grid-template-columns:repeat(4,1fr);max-height:44vh}

  #main{position:relative}
  #chart-panel{width:100%}

  #chart-top{
    height:auto;min-height:40px;flex-wrap:wrap;overflow:visible;
    padding:6px 10px;gap:6px 8px
  }
  .cstat{min-width:44px}

  #mobile-panel-btn{
    display:flex;align-items:center;gap:4px;
    background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.32);
    color:var(--purple);padding:5px 11px;border-radius:6px;
    font-family:var(--font-ui);font-size:10px;font-weight:600;
    cursor:pointer;white-space:nowrap;flex-shrink:0;
    transition:var(--trans);min-height:30px
  }
  #mobile-panel-btn:hover{background:rgba(167,139,250,.22)}

  #signals-panel{
    position:fixed;bottom:0;left:0;right:0;
    width:100%;min-width:unset;
    max-height:72vh;border-left:none;
    border-top:1px solid var(--border2);
    border-radius:20px 20px 0 0;
    transform:translateY(100%);
    transition:transform var(--sheet-trans);
    z-index:400;
    box-shadow:0 -16px 56px rgba(0,0,0,.85),0 -1px 0 rgba(255,255,255,.04)
  }
  #signals-panel.mobile-open{transform:translateY(0)}

  .panel-handle{
    display:block;width:36px;height:4px;
    background:var(--border2);border-radius:2px;
    margin:12px auto 6px;flex-shrink:0;cursor:pointer;
    transition:background .2s
  }
  .panel-handle:hover{background:#3a4a62}

  .sig-section{padding:10px 14px}
  .manual-long-btn,.manual-short-btn{padding:15px 4px;font-size:14px}

  #quick-bar{
    display:flex;flex-shrink:0;align-items:center;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--surface2),var(--surface));
    border-top:1px solid var(--border2);
    box-shadow:0 -6px 20px rgba(0,0,0,.35)
  }
  #quick-bar button{
    flex:1;padding:13px 6px;border-radius:10px;border:1px solid;cursor:pointer;
    font-family:var(--font-ui);font-size:14px;font-weight:700;letter-spacing:.4px;
    -webkit-tap-highlight-color:transparent
  }
  #quick-bar button:disabled{opacity:.4}
  #quick-bar .qb-long{background:rgba(20,184,143,.14);border-color:rgba(45,224,184,.45);color:var(--green2)}
  #quick-bar .qb-short{background:rgba(224,64,95,.12);border-color:rgba(255,93,126,.42);color:var(--red2)}
  #quick-bar .qb-cancel{flex:0 0 52px;background:rgba(125,136,152,.1);border-color:var(--border2);color:var(--text2)}
  #quick-bar .qb-close{background:rgba(255,93,126,.1);border-color:rgba(255,93,126,.4);color:var(--red2)}
  #quick-bar .qb-info{flex:1.3;text-align:center;font-family:var(--font-data);font-size:11px;font-weight:600;color:var(--text2);line-height:1.3}

  #log-modal{align-items:flex-end;padding:0}
  #log-panel{
    width:100%;max-height:92dvh;
    border-radius:20px 20px 0 0;
    border:none;border-top:1px solid var(--border2);
    animation:logSlideUp .28s cubic-bezier(.32,.72,0,1)
  }
  @keyframes logSlideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

  .log-tabs{overflow-x:auto;scrollbar-width:none}
  .log-tabs::-webkit-scrollbar{display:none}
  .log-tab{padding:10px 16px;min-width:80px;font-size:10px}

  .log-stats-grid{grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .log-stat-big{font-size:24px}

  .log-history-table{font-size:9px}
  .log-history-table td,.log-history-table th{padding:6px 8px}

  .las-grid{grid-template-columns:1fr}
  .las-header{gap:8px}
}

/* ══ v62 DESIGN LAYER ═══════════════════════════════════
   One set of tokens, one button size, one card style. */
:root{
  --r-sm:8px;--r-md:12px;--r-lg:18px;
  --fs-2xs:9px;--fs-xs:10px;--fs-sm:11px;--fs-md:12px;--fs-lg:14px;--fs-xl:18px;
  --hair:rgba(255,255,255,.06);--glass:rgba(16,23,35,.9);--btn-h:34px;
  --shadow-pop:0 18px 48px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);
  --accent:#f0b90b;--accent-bg:rgba(240,185,11,.11);--accent-bd:rgba(240,185,11,.34);
}
#hdr{height:56px;background:linear-gradient(180deg,#131b29 0%,var(--surface) 100%);border-bottom:1px solid var(--hair);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.logo{font-family:var(--font-ui);font-size:12px;letter-spacing:2.4px;font-weight:800;text-shadow:none}
.log-btn,.lay-btn,#mobile-panel-btn,#bubble-btn{
  height:var(--btn-h);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;
  border-radius:var(--r-sm);font-family:var(--font-ui);font-size:var(--fs-md);font-weight:600;line-height:1;
  border:1px solid var(--border2);background:var(--surface3);color:var(--text2);cursor:pointer;transition:var(--trans);white-space:nowrap
}
.log-btn:hover,.lay-btn:hover{color:var(--text);border-color:#3b4d68;background:#1d2a3d;box-shadow:none}
.lay-btn.on{color:var(--accent);border-color:var(--accent-bd);background:var(--accent-bg)}
#mobile-panel-btn{display:none;background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.34);color:#c9a0ff;min-height:0}
#bubble-btn{padding:0 10px;font-size:var(--fs-xs);letter-spacing:.06em}
.coin-btn{min-height:var(--btn-h);border-radius:var(--r-sm);padding:5px 12px}
.coin-btn-sym{font-family:var(--font-ui);font-size:14px;letter-spacing:.02em}
#thr-inp{height:var(--btn-h);border-radius:var(--r-sm)}
#auto-thr-btn{height:var(--btn-h);border-radius:var(--r-sm);padding:0 12px;font-size:var(--fs-xs)}
.tf-sel{height:var(--btn-h);min-width:76px;padding:0 26px 0 12px;border-radius:var(--r-sm);font-size:var(--fs-lg);font-weight:700;
  appearance:none;-webkit-appearance:none;
  background:var(--accent-bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23f0b90b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 10px center;
  border:1px solid var(--accent-bd);color:var(--accent)}
#chart-panel{position:relative}
#chart-top{height:46px;padding:0 12px;gap:12px;background:var(--surface);border-bottom:1px solid var(--hair)}
.cstat-lbl,.candle-timer-lbl{font-size:var(--fs-2xs);letter-spacing:.08em;white-space:nowrap}
.cstat-val{white-space:nowrap}
.candle-timer-outer{margin-right:auto}
#chart-loading{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text3)}

/* layers popover */
#layers-pop{position:absolute;top:50px;left:12px;width:292px;max-width:calc(100% - 24px);background:var(--glass);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:var(--r-md);
  box-shadow:var(--shadow-pop);z-index:30;display:none;padding:6px 6px 8px}
#layers-pop.open{display:block;animation:panelIn .16s ease}
.lp-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;font-family:var(--font-ui);font-size:var(--fs-xs);
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.lp-x{background:none;border:0;color:var(--text3);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.lp-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;-webkit-user-select:none;user-select:none}
.lp-row:hover,.lp-row:active{background:rgba(255,255,255,.04)}
.lp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;opacity:.45;transition:opacity .2s}
.lp-row.on .lp-dot{opacity:1}
.lp-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lp-lbl{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--text)}
.lp-sub{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text3)}

    const base=`https://fapi.binance.com/fapi/v1/aggTrades?symbol=${symAt.toUpperCase()}&limit=1000`;
    let arr=await (await fetch(base)).json();if(!Array.isArray(arr)||!arr.length)throw 0;
    const all=[...arr];

      const prev=await (await fetch(base+'&fromId='+from)).json();if(!Array.isArray(prev)||!prev.length)break;

    const lineInfo=getLineAtY(cursorY);body.style.cursor=lineInfo?'ns-resize':'crosshair';redrawCrosshairCanvas();
  });
  body.addEventListener('mousedown',(e)=>{
    if(!chartLayout.cAH)return;const rect=body.getBoundingClientRect();const my=e.clientY-rect.top;const lineInfo=getLineAtY(my);
    if(!lineInfo){pan={x:e.clientX,end:viewEnd};e.preventDefault();return;}
    if(lineInfo.src==='setup'&&tradeSetup)tradeSetup.dragging=lineInfo.name;else if(lineInfo.src==='active')activeLineDrag=lineInfo.name;
    body.style.cursor='ns-resize';e.preventDefault();
  });
  const endMouse=()=>{
    pan=null;
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    body.style.cursor='crosshair';redrawCrosshairCanvas();
  };
  body.addEventListener('mouseup',endMouse);
  body.addEventListener('mouseleave',()=>{endMouse();cursorX=null;cursorY=null;redrawCrosshairCanvas();});
  body.addEventListener('wheel',(e)=>{e.preventDefault();const L=chartLayout;if(!L||!L.N)return;setView(L.N*(e.deltaY>0?1.12:0.89),relX(e));},{passive:false});
  document.getElementById('jump-latest').addEventListener('click',()=>{viewEnd=0;scheduleDraw();});

  // Touch / pen: drag a line, else drag to pan; two fingers to pinch-zoom
  const pts=new Map();let pinch=null,touchPan=null;
  body.addEventListener('pointerdown',(e)=>{
    if(e.pointerType==='mouse')return;
    try{body.setPointerCapture(e.pointerId);}catch(_){}
    const rect=body.getBoundingClientRect();
    pts.set(e.pointerId,{x:e.clientX-rect.left,y:e.clientY-rect.top});
    cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    if(pts.size===2){
      if(tradeSetup?.dragging)tradeSetup.dragging=null;activeLineDrag=null;touchPan=null;
      const [a,b]=[...pts.values()];pinch={d0:Math.max(12,Math.hypot(a.x-b.x,a.y-b.y)),N0:chartLayout.N||viewN};cursorX=null;cursorY=null;
      return;
    }
    const lineInfo=getLineAtY(cursorY);
    if(lineInfo){
      if(lineInfo.src==='setup'&&tradeSetup)tradeSetup.dragging=lineInfo.name;
      else if(lineInfo.src==='active')activeLineDrag=lineInfo.name;
    }else touchPan={x:e.clientX,end:viewEnd,moved:false};
    redrawCrosshairCanvas();
  },{passive:true});

  body.addEventListener('pointermove',(e)=>{
    if(e.pointerType==='mouse'||!pts.has(e.pointerId))return;
    const rect=body.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    pts.set(e.pointerId,{x,y});
    if(pinch&&pts.size>=2){const [a,b]=[...pts.values()],d=Math.max(12,Math.hypot(a.x-b.x,a.y-b.y));setView(pinch.N0*pinch.d0/d,(a.x+b.x)/2);return;}
    cursorX=x;cursorY=y;
    if(tradeSetup?.dragging){tradeSetup[tradeSetup.dragging]=yToPrice(cursorY);syncFormFromDrag();redrawCrosshairCanvas();return;}
    if(activeLineDrag&&activeLogEntry&&!activeLogEntry.outcome){
      updateActiveTradeLevel(activeLineDrag,yToPrice(cursorY));
      if(dragRafId)cancelAnimationFrame(dragRafId);
      dragRafId=requestAnimationFrame(()=>{drawChart();dragRafId=null;});
      return;
    }
    if(touchPan){if(!touchPan.moved&&Math.abs(e.clientX-touchPan.x)>6)touchPan.moved=true;if(touchPan.moved){cursorX=null;cursorY=null;panView(touchPan.end,e.clientX-touchPan.x);return;}}
    redrawCrosshairCanvas();
  },{passive:true});

  const endPtr=(e)=>{
    if(e.pointerType==='mouse')return;
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===0){
      const moved=touchPan&&touchPan.moved;touchPan=null;
      if(tradeSetup?.dragging)tradeSetup.dragging=null;
      if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
      if(moved){cursorX=null;cursorY=null;redrawCrosshairCanvas();}
      else setTimeout(()=>{cursorX=null;cursorY=null;redrawCrosshairCanvas();},1800);
    }
  };
  body.addEventListener('pointerup',endPtr,{passive:true});
  body.addEventListener('pointercancel',(e)=>{endPtr(e);if(tradeSetup?.dragging)tradeSetup.dragging=null;activeLineDrag=null;cursorX=null;cursorY=null;redrawCrosshairCanvas();},{passive:true});
}

function calcVolumeProfile(candles,bins=60){if(!candles||candles.length<5)return null;const use=candles.slice(-100);let hi=-Infinity,lo=Infinity,totalVol=0;use.forEach(c=>{if(c.h>hi)hi=c.h;if(c.l<lo)lo=c.l;totalVol+=c.v;});const range=hi-lo;if(range<=0||totalVol<=0)return null;const binSize=range/bins,profile=new Array(bins).fill(0);use.forEach(c=>{const b0=Math.max(0,Math.floor((c.l-lo)/binSize)),b1=Math.min(bins-1,Math.floor((c.h-lo)/binSize)),count=b1-b0+1;for(let b=b0;b<=b1;b++)profile[b]+=c.v/count;});let maxVol=0,vpocBin=0;profile.forEach((v,i)=>{if(v>maxVol){maxVol=v;vpocBin=i;}});let vaVol=profile[vpocBin],vaLo=vpocBin,vaHi=vpocBin;const target=totalVol*0.70;while(vaVol<target&&(vaLo>0||vaHi<bins-1)){const dv=vaLo>0?profile[vaLo-1]:-1,uv=vaHi<bins-1?profile[vaHi+1]:-1;if(uv>=dv&&uv>=0){vaHi++;vaVol+=profile[vaHi];}else if(dv>=0){vaLo--;vaVol+=profile[vaLo];}else break;}return{profile,bins,priceLow:lo,priceHigh:hi,binSize,maxVol,vpocPrice:lo+(vpocBin+0.5)*binSize,vahPrice:lo+(vaHi+1)*binSize,valPrice:lo+vaLo*binSize};}
function calcMarketStructure(candles,lb=5){if(!candles||candles.length<lb*3+5)return null;const sH=[],sL=[];for(let i=lb;i<candles.length-lb;i++){let isH=true,isL=true;for(let j=1;j<=lb;j++){if(candles[i-j].h>=candles[i].h||candles[i+j].h>=candles[i].h)isH=false;if(candles[i-j].l<=candles[i].l||candles[i+j].l<=candles[i].l)isL=false;}if(isH)sH.push({price:candles[i].h,t:candles[i].t,idx:i});if(isL)sL.push({price:candles[i].l,t:candles[i].t,idx:i});}if(sH.length<2||sL.length<2)return null;const rH=sH.slice(-4),rL=sL.slice(-4),lastH=rH[rH.length-1],prevH=rH[rH.length-2],lastL=rL[rL.length-1],prevL=rL[rL.length-2];const isHH=lastH&&prevH&&lastH.price>prevH.price,isHL=lastL&&prevL&&lastL.price>prevL.price,isLH=lastH&&prevH&&lastH.price<prevH.price,isLL=lastL&&prevL&&lastL.price<prevL.price;let structure='range';if(isHH&&isHL)structure='bullish';else if(isLH&&isLL)structure='bearish';let bos=null;if(livePrice&&lastH&&livePrice>lastH.price)bos={type:'bullish',price:lastH.price,label:'BOS ▲'};else if(livePrice&&lastL&&livePrice<lastL.price)bos={type:'bearish',price:lastL.price,label:'BOS ▼'};return{structure,lastH,lastL,bos,isHH,isHL,isLH,isLL};}
function calcSR(allC){if(allC.length<10)return{supports:[],resistances:[]};const LB=4,highs=[],lows=[];for(let i=LB;i<allC.length-LB;i++){const c=allC[i];let isH=true,isL=true;for(let j=1;j<=LB;j++){if(allC[i-j].h>=c.h||allC[i+j].h>=c.h)isH=false;if(allC[i-j].l<=c.l||allC[i+j].l<=c.l)isL=false;}if(isH)highs.push(c.h);if(isL)lows.push(c.l);}const cluster=prices=>{const groups=[];prices.sort((a,b)=>a-b).forEach(p=>{const g=groups.find(g=>Math.abs(g.price-p)/Math.max(p,.0001)<0.004);if(g){g.price=(g.price*g.count+p)/(g.count+1);g.count++;}else groups.push({price:p,count:1,wallUsd:0,confirmed:false});});return groups.sort((a,b)=>b.count-a.count).slice(0,6);};const resistances=cluster(highs),supports=cluster(lows);if(book.bids.length&&book.asks.length&&livePrice){const bigOrders=[...book.bids,...book.asks].filter(o=>o.usd>=THRESHOLD);[...resistances,...supports].forEach(level=>{const near=bigOrders.filter(o=>Math.abs(o.price-level.price)/Math.max(level.price,.0001)<0.004);if(near.length>0){const largest=near.reduce((a,b)=>b.usd>a.usd?b:a);level.wallUsd=largest.usd;level.confirmed=true;}});}return{resistances,supports};}
function calcATRPct(n=14){if(!candles||candles.length<3||!livePrice)return 0;const use=candles.slice(-Math.min(n+1,candles.length));let sum=0,count=0;for(let i=1;i<use.length;i++){const c=use[i],p=use[i-1],tr=Math.max(c.h-c.l,Math.abs(c.h-p.c2),Math.abs(c.l-p.c2));sum+=tr;count++;}return count===0?0:Math.max(0.01,Math.min(15,(sum/count)/livePrice*100));}

function calcLiquidityZones(){
  const src=zoneSource();if(!src||src.length<20||!livePrice)return{bsl:[],ssl:[],swept:[],n:0};
  const LB=5,n=src.length,EQ=0.0012,hiIdx=[],loIdx=[];
  for(let i=LB;i<n-LB;i++){let isH=true,isL=true;for(let j=1;j<=LB;j++){if(src[i-j].h>=src[i].h||src[i+j].h>=src[i].h)isH=false;if(src[i-j].l<=src[i].l||src[i+j].l<=src[i].l)isL=false;}if(isH)hiIdx.push(i);if(isL)loIdx.push(i);}
  // a level is SWEPT once any later candle trades beyond it; reclaimed = that candle closed back inside
  const mk=(i,side)=>{const p=side==='bsl'?src[i].h:src[i].l;let j=-1;for(let q=i+1;q<n;q++){if(side==='bsl'?src[q].h>p:src[q].l<p){j=q;break;}}
    return{side,price:p,t:src[i].t,idx:i,sweptIdx:j,sweptT:j>=0?src[j].t:0,reclaimed:j>=0?(side==='bsl'?src[j].c2<p:src[j].c2>p):false};};
  const H=hiIdx.map(i=>mk(i,'bsl')),L=loIdx.map(i=>mk(i,'ssl'));
  const tag=arr=>arr.map((z,i)=>({...z,isEqual:arr.some((q,j)=>j!==i&&Math.abs(z.price-q.price)/Math.max(z.price,.0001)<EQ)}));
  const dist=z=>({...z,dist:((z.price-livePrice)/livePrice*100)});
  // levels within the tolerance of each other are one cluster: keep the outermost price, mark as equal highs / lows
  const merge=(arr,farther)=>{const out=[];arr.forEach(z=>{const g=out[out.length-1];if(g&&Math.abs(z.price-g.price)/Math.max(g.price,.0001)<EQ){g.count++;g.isEqual=true;if(farther(z.price,g.price)){g.price=z.price;g.t=z.t;}}else out.push({...z,count:1});});return out;};
  const bsl=merge(tag(H.filter(z=>z.sweptIdx<0)).filter(z=>z.price>livePrice).sort((a,b)=>a.price-b.price),(a,b)=>a>b).map(dist).slice(0,4);
  const ssl=merge(tag(L.filter(z=>z.sweptIdx<0)).filter(z=>z.price<livePrice).sort((a,b)=>b.price-a.price),(a,b)=>a<b).map(dist).slice(0,4);
  const recent=arr=>arr.filter(z=>z.sweptIdx>=n-100).sort((a,b)=>b.sweptIdx-a.sweptIdx).slice(0,3).map(dist);
  return{bsl,ssl,swept:[...recent(H),...recent(L)],n};
}

function drawFootprint(ctx,p2y,cW,cAH,mode){

  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="st-eq"><defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><line x1="${pad}" x2="${W-pad}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 4"/><path d="${line} L${x(all.length-1).toFixed(1)} ${H-pad} L${x(0).toFixed(1)} ${H-pad} Z" fill="url(#eqg)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;}
function renderLogStats(){
  const closed=tradeLog.filter(e=>e.outcome&&e.exitPct!=null).slice().reverse();
  if(!closed.length)return'<div class="st-wrap"><div class="st-empty big">No completed trades yet.<br>Stats appear here once a trade closes.</div></div>';
  const rows=closed.map(e=>({e,r:tradeR(e)})).filter(x=>x.r!==null),skipped=closed.length-rows.length,n=rows.length;
  if(!n)return'<div class="st-wrap"><div class="st-empty big">Closed trades have no stop level, so R cannot be computed.</div></div>';
  const wins=rows.filter(x=>x.r>0),gw=wins.reduce((a,x)=>a+x.r,0),gl=Math.abs(rows.filter(x=>x.r<=0).reduce((a,x)=>a+x.r,0)),totalR=rows.reduce((a,x)=>a+x.r,0),avgR=totalR/n,wr=wins.length/n*100,pf=gl?gw/gl:(gw?Infinity:0);
  let cum=0,peak=0,dd=0;const curve=rows.map(x=>{cum+=x.r;if(cum>peak)peak=cum;if(peak-cum>dd)dd=peak-cum;return cum;});
  const rs=rows.map(x=>x.r),best=Math.max(...rs),worst=Math.min(...rs);
  const grp=fn=>{const m={};rows.forEach(x=>{const k=fn(x.e);(m[k]=m[k]||{n:0,w:0,r:0});m[k].n++;m[k].r+=x.r;if(x.r>0)m[k].w++;});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n);};
  const tbl=(title,list)=>`<div class="st-card"><div class="st-card-t">${title}</div><table class="st-tbl"><thead><tr><th></th><th>Trades</th><th>Win</th><th>Avg R</th></tr></thead><tbody>${list.map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${Math.round(v.w/v.n*100)}%</td><td class="${v.r>=0?'pos':'neg'}">${fmtR(v.r/v.n)}</td></tr>`).join('')}</tbody></table></div>`;

  return`<div class="st-wrap">
    <div class="st-hero"><div class="st-hero-l"><div class="st-t">Total result</div><div class="st-hero-v ${totalR>=0?'pos':'neg'}">${fmtR(totalR)}</div><div class="st-s">${n} trade${n===1?'':'s'} · after ~${FEE_PCT}% fees</div></div><div class="st-hero-r">${equitySVG(curve)}</div></div>
    ${n<30?`<div class="st-note">Only ${n} trade${n===1?'':'s'} so far. Treat these numbers as noise until you have 50–100 per setup.</div>`:''}
    <div class="st-tiles">
      ${tile('Win rate',wr.toFixed(0)+'%',wins.length+' of '+n,wr>=50?'pos':'neg')}
      ${tile('Avg R / trade',fmtR(avgR),'expectancy',avgR>=0?'pos':'neg')}
      ${tile('Profit factor',pf===Infinity?'∞':pf.toFixed(2),'gross win ÷ gross loss',pf>=1?'pos':'neg')}
      ${tile('Max drawdown','-'+dd.toFixed(2)+'R','peak to trough','neg')}
      ${tile('Best trade',fmtR(best),'','pos')}
      ${tile('Worst trade',fmtR(worst),'','neg')}
    </div>
    <div class="st-two">${tbl('By direction',grp(e=>e.direction==='LONG'?'▲ Long':'▼ Short'))}${tbl('By timeframe',grp(e=>e.tf))}</div>
    <div class="st-card"><div class="st-card-t">How trades ended</div><div class="st-chips">${Object.entries(oc).map(([k,v])=>`<span class="st-chip">${ocL[k]||k}<b>${v}</b></span>`).join('')}</div></div>
    ${skipped?`<div class="st-foot">${skipped} trade${skipped===1?'':'s'} left out (no stop level, so no R).</div>`:''}
    <div class="st-foot">R = result ÷ distance to your stop. Manual closes and expired trades are counted.</div>
  </div>`;}

function saveCustomTF(name){try{const a=[name,...getSavedTFs().filter(x=>x!==name)].slice(0,6);localStorage.setItem('lh_custom_tfs',JSON.stringify(a));}catch(e){}}
function updateTFButtons(){const sel=document.getElementById('tf-select');if(!sel)return;
  const nat=NATIVE_TF.map(x=>x[1]),extra=[...new Set([...getSavedTFs(),chartInterval])].filter(x=>!nat.includes(x));
  let h='<optgroup label="Timeframes">'+nat.map(t=>`<option value="${t}">${t}</option>`).join('')+'</optgroup>';
  if(extra.length)h+='<optgroup label="Custom">'+extra.map(t=>`<option value="${t}">${t}</option>`).join('')+'</optgroup>';
  h+='<option value="__custom__">＋ Custom…</option>';
  sel.innerHTML=h;sel.value=chartInterval;}
function askCustomTF(){const last=getSavedTFs()[0]||'';
  const v=prompt('Custom timeframe (examples: 7m, 10m, 45m, 2h, 3h). 1 minute to 1 day. Weekly and monthly are in the main list.',last||'10m');
  if(v===null){updateTFButtons();return;}
  const min=parseTF(v);if(!min){alert('Could not read that. Use a number of minutes or hours, e.g. 10m or 3h.');updateTFButtons();return;}
  const name=tfName(min);if(!NATIVE_TF.some(x=>x[1]===name))saveCustomTF(name);
  changeInterval(name);updateTFButtons();}

function resetAndConnect(){
  zoneBase=[];liqEvents=[];viewEnd=0;fpReset(false);
  livePrice=0;prevPrice=0;book={bids:[],asks:[]};prevWalls={bids:{},asks:{}};hunts=[];tradeBuffer=[];wallTimestamps={};obSnaps=[];clearAnalysisCache();
  const lp=document.getElementById('live-price');if(lp)lp.textContent='Loading…';
  ['cs-spread','cs-cvd'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='—';});
  const lz=document.getElementById('liq-zones-list');if(lz)lz.innerHTML='<div class="sig-empty">Loading…</div>';
  const ma=document.getElementById('manual-entry-area');if(ma&&!activeLogEntry&&!manualEntryDir){ma.innerHTML=`<div class="manual-trade-btns"><button class="manual-long-btn" id="manual-long-btn">▲ LONG</button><button class="manual-short-btn" id="manual-short-btn">▼ SHORT</button></div>`;document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));}
  connect();startSnapshotScheduler();
}

function fmtP(p){if(!p&&p!==0)return'—';if(p>=1000)return p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=1)return p.toFixed(4);return p.toFixed(6);}
function fAx(p,range){if(p>=1000&&range/p<0.004){const st=range/9,d=st>=1?0:st>=0.1?1:st>=0.01?2:3;return p.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}return fPS(p);}
function fPS(p){if(!p)return'0';if(p>=1000)return(p/1000).toFixed(1)+'k';if(p>=1)return p.toFixed(2);return p.toFixed(4);}
function fmtV(v){const cs=currSym;if(v>=1e9)return cs+(v/1e9).toFixed(2)+'B';if(v>=1e6)return cs+(v/1e6).toFixed(2)+'M';if(v>=1e3)return cs+(v/1e3).toFixed(1)+'K';return cs+v.toFixed(0);}

// ── Mobile quick trade bar (LONG/SHORT, confirm, close — no need to open the Analysis sheet) ──
let _qbKey='';
function renderQuickBar(){
  const bar=document.getElementById('quick-bar');if(!bar)return;
  const open=!!(activeLogEntry&&!activeLogEntry.outcome);
  const key=open?'active':(manualEntryDir!==null?'form':'idle');
  if(key!==_qbKey){
    _qbKey=key;
    if(key==='idle')bar.innerHTML='<button class="qb-long" data-act="long">▲ LONG</button><button class="qb-short" data-act="short">▼ SHORT</button>';
    else if(key==='form')bar.innerHTML='<button class="qb-cancel" data-act="cancel">✗</button><span class="qb-info" id="qb-info">Drag the lines</span><button class="qb-long" data-act="confirm">✓ CONFIRM</button>';
    else bar.innerHTML='<span class="qb-info" id="qb-info">—</span><button class="qb-close" data-act="close">Close at market</button>';
  }
  const info=document.getElementById('qb-info');
  if(info&&key==='form'&&tradeSetup){const{entry,t1,sl,dir}=tradeSetup;let t=(dir==='LONG'?'▲ LONG':'▼ SHORT');if(entry&&t1&&sl&&Math.abs(sl-entry)>0)t+=' · R/R '+(Math.abs(t1-entry)/Math.abs(sl-entry)).toFixed(1)+':1';info.textContent=t;}
  if(info&&key==='active'&&activeLogEntry&&livePrice){const e=activeLogEntry,pp=((livePrice-e.entry)/e.entry*100)*(e.direction==='LONG'?1:-1);info.textContent=(e.direction==='LONG'?'▲ LONG ':'▼ SHORT ')+(pp>=0?'+':'')+pp.toFixed(2)+'%';info.style.color=pp>=0?'var(--green2)':'var(--red2)';}
  bar.querySelectorAll('[data-act=long],[data-act=short]').forEach(b=>{b.disabled=!livePrice;});
}
document.getElementById('quick-bar').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='long'||a==='short'){if(livePrice)openEntryForm(a==='long'?'LONG':'SHORT');}
  else if(a==='confirm')confirmManualEntry();
  else if(a==='cancel')cancelEntryForm();
  else if(a==='close'){if(activeLogEntry&&!activeLogEntry.outcome)resolveLogEntry(activeLogEntry,'MANUAL_CLOSE',livePrice);}
  renderQuickBar();
});
setInterval(renderQuickBar,300);renderQuickBar();
