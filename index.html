<html data-type="html" data-identifier="dc3b6f66-93c0-4a98-8323-4a2388a7b419" data-title="Liquidity Hunter" data-version="61"><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
<style>
:root{
  --bg:#0b0f17;--surface:#0f1520;--surface2:#141d2b;--surface3:#1a2535;
  --border:#1e2d40;--border2:#2a3a52;
  --text:#e4eaf2;--text2:#96a6b8;--text3:#5e7082;
  --green:#2ea06b;--green2:#3dd68c;--red:#c93a3a;--red2:#f6465d;
  --yellow:#e8a817;--yellow2:#f0b90b;--purple:#a855f7;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-data:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --trans:.2s cubic-bezier(.4,0,.2,1);
  --sheet-trans:.32s cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4a62}

html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-data);font-size:12px;
  width:100%;height:100vh;height:100dvh;
  overflow:hidden;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}

/* ── HEADER ──────────────────────────────────── */
#hdr{
  height:54px;flex-shrink:0;
  background:linear-gradient(180deg,#171f2e 0%,var(--surface2) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  position:relative;z-index:20
}
.logo{
  font-size:15px;font-weight:700;color:var(--yellow2);
  letter-spacing:1.5px;white-space:nowrap;
  text-shadow:0 0 28px rgba(240,185,11,.4),0 0 56px rgba(240,185,11,.15)
}
.hdr-sep{width:1px;height:26px;background:var(--border2);flex-shrink:0}
.price-block{display:flex;flex-direction:column;gap:2px}
.price-top{display:flex;align-items:center;gap:8px}
#pair-sym{font-family:var(--font-ui);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
#exch-badge{font-family:var(--font-ui);font-size:9px;padding:1px 6px;border-radius:10px;font-weight:600;background:rgba(246,70,93,.1);color:var(--red2);border:1px solid rgba(246,70,93,.2)}
#live-price{font-size:22px;font-weight:700;color:var(--green2);transition:color .25s;line-height:1}
#live-price.dn{color:var(--red2)}
.log-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--surface3);border:1px solid var(--border2);color:var(--text2);
  padding:6px 12px;border-radius:8px;font-family:var(--font-ui);font-size:11px;
  cursor:pointer;transition:var(--trans);white-space:nowrap;flex-shrink:0
}
.log-btn:hover{border-color:var(--purple);color:var(--purple);background:rgba(168,85,247,.07);box-shadow:0 0 12px rgba(168,85,247,.15)}
.log-btn.has-active{border-color:rgba(61,214,140,.4);color:var(--green2);animation:tradeGlow 2s infinite}
@keyframes tradeGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px rgba(61,214,140,.25)}}
.log-count{font-size:9px;font-weight:700;background:var(--purple);color:#fff;padding:1px 5px;border-radius:8px;display:none}
.log-count.show{display:inline}
.thr-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.thr-wrap label{font-family:var(--font-ui);font-size:11px;color:var(--text2);white-space:nowrap}
#thr-inp{
  background:var(--surface3);border:1px solid var(--border2);color:var(--yellow2);
  padding:5px 7px;border-radius:6px;font-family:var(--font-data);font-size:11px;
  width:80px;outline:none;transition:var(--trans)
}
#thr-inp:focus{border-color:rgba(240,185,11,.5);box-shadow:0 0 0 2px rgba(240,185,11,.08)}
#auto-thr-btn{font-family:var(--font-ui);font-size:10px;padding:4px 10px;border-radius:5px;cursor:pointer;font-weight:600;transition:var(--trans);white-space:nowrap;line-height:1.4}
#auto-thr-btn.auto{background:rgba(46,160,107,.12);border:1px solid rgba(46,160,107,.3);color:var(--green2)}
#auto-thr-btn.auto:hover{background:rgba(46,160,107,.22);box-shadow:0 0 8px rgba(46,160,107,.2)}
#auto-thr-btn.manual{background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.25);color:var(--yellow2)}
.conn-wrap{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
#conn-txt{font-family:var(--font-ui);font-size:11px;color:var(--text2)}
#conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red2);flex-shrink:0;transition:background .3s}
#conn-dot.on{background:#2ea06b;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,160,107,.5)}60%{box-shadow:0 0 0 5px rgba(46,160,107,0)}}

/* ── COIN DROPDOWN ───────────────────────────── */
.coin-dropdown{position:relative;flex-shrink:0}
.coin-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--surface3);border:1px solid var(--border2);
  padding:6px 12px;border-radius:8px;cursor:pointer;
  transition:var(--trans);min-width:140px;justify-content:space-between
}
.coin-btn:hover{border-color:rgba(240,185,11,.45);box-shadow:0 0 12px rgba(240,185,11,.08)}
.coin-btn.open{border-color:rgba(240,185,11,.6);background:rgba(240,185,11,.05);box-shadow:0 0 16px rgba(240,185,11,.12)}
.coin-btn-info{display:flex;flex-direction:column;gap:2px}
.coin-btn-sym{font-size:13px;font-weight:700;color:var(--yellow2);line-height:1}
.coin-btn-px{font-family:var(--font-ui);font-size:10px;color:var(--text2)}
.coin-btn-arrow{font-size:11px;color:var(--text3);transition:transform .22s}
.coin-btn.open .coin-btn-arrow{transform:rotate(180deg)}
.coin-panel{
  position:absolute;top:calc(100% + 8px);left:0;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:14px;padding:10px;z-index:500;display:none;
  width:500px;
  box-shadow:0 24px 64px rgba(0,0,0,.96),0 0 0 1px rgba(255,255,255,.03);
  flex-direction:column;
  animation:panelIn .18s ease
}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.coin-panel.open{display:flex}
.coin-panel-hdr{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;flex-shrink:0}
.coin-panel-title{font-family:var(--font-ui);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.coin-panel-count{font-family:var(--font-ui);font-size:10px;color:var(--text3)}
.coin-search-wrap{position:relative;margin-bottom:8px;flex-shrink:0}
#coin-search{
  width:100%;background:var(--surface3);border:1px solid var(--border2);
  color:var(--text);padding:7px 10px 7px 30px;border-radius:8px;
  font-family:var(--font-ui);font-size:11px;outline:none;transition:var(--trans)
}
#coin-search:focus{border-color:rgba(240,185,11,.4);box-shadow:0 0 0 2px rgba(240,185,11,.08)}
.coin-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text3);pointer-events:none}
.coin-loading{font-family:var(--font-ui);font-size:11px;color:var(--text3);text-align:center;padding:20px;animation:fadeP 1.5s infinite}
@keyframes fadeP{0%,100%{opacity:1}50%{opacity:.3}}
.coin-grid-scroll{overflow-y:auto;max-height:300px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.coin-item{
  background:rgba(255,255,255,.025);border:1px solid var(--border);
  border-radius:8px;padding:7px 3px 6px;cursor:pointer;transition:var(--trans);
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center
}
.coin-item:hover{border-color:rgba(240,185,11,.5);background:rgba(240,185,11,.07);transform:translateY(-1px);box-shadow:0 2px 8px rgba(240,185,11,.12)}
.coin-item.active{border-color:rgba(61,214,140,.6);background:rgba(61,214,140,.08);box-shadow:0 0 10px rgba(61,214,140,.1)}
.coin-item-sym{font-size:9px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.coin-item-vol{font-family:var(--font-ui);font-size:7px;color:var(--text3);height:9px}
.coin-item.active .coin-item-sym{color:var(--green2)}
.coin-item.active .coin-item-vol{color:rgba(61,214,140,.5)}

/* ── MAIN LAYOUT ─────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#chart-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}

/* ── CHART TOP BAR ───────────────────────────── */
#chart-top{
  height:40px;flex-shrink:0;
  background:linear-gradient(180deg,var(--surface2) 0%,rgba(18,25,38,.97) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px
}
.cstat{display:flex;flex-direction:column;align-items:center;min-width:52px;gap:1px}
.cstat-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.cstat-val{font-family:var(--font-data);font-size:12px;font-weight:600;color:var(--text)}
.cstat-sep{width:1px;height:20px;background:var(--border2);flex-shrink:0}
#cs-cvd.bull{color:var(--green2)}#cs-cvd.bear{color:var(--red2)}#cs-cvd.flat{color:var(--text2)}
.candle-timer-wrap{display:flex;flex-direction:column;align-items:center;min-width:60px;gap:1px}
.candle-timer-lbl{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
#cs-candle{font-family:var(--font-data);font-size:14px;font-weight:700;color:var(--green2);letter-spacing:.5px;transition:color .3s;line-height:1}
#cs-candle.warn{color:var(--yellow2)}
#cs-candle.urgent{color:var(--red2);animation:timerPulse .5s infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.4}}
.candle-timer-outer{display:flex;align-items:center;gap:8px}
.candle-progress-bar{width:48px;height:4px;background:var(--border2);border-radius:2px;overflow:hidden}
.candle-progress-fill{height:100%;border-radius:2px;transition:width .9s linear,background .3s}
.tf-grp{display:flex;gap:2px;margin-left:auto}
.tf-btn{
  background:transparent;border:1px solid transparent;color:var(--text2);
  padding:4px 10px;border-radius:5px;font-family:var(--font-ui);font-size:11px;
  font-weight:500;cursor:pointer;transition:var(--trans);white-space:nowrap
}
.tf-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tf-btn.active{background:rgba(240,185,11,.12);border-color:rgba(240,185,11,.32);color:var(--yellow2);font-weight:700}
#bubble-btn{
  display:flex;align-items:center;gap:5px;background:var(--surface3);
  border:1px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:6px;
  font-family:var(--font-ui);font-size:10px;font-weight:600;cursor:pointer;
  transition:var(--trans);white-space:nowrap;letter-spacing:.3px;margin-left:4px
}
#bubble-btn.live{border-color:rgba(61,214,140,.35);color:var(--green2);background:rgba(61,214,140,.07)}
#bubble-btn.fade{border-color:rgba(240,185,11,.35);color:var(--yellow2);background:rgba(240,185,11,.07)}
.bubble-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#bubble-btn.live .bubble-dot{background:var(--green2)}
#bubble-btn.fade .bubble-dot{background:var(--yellow2);animation:bubPulse 1.5s infinite}
@keyframes bubPulse{0%,100%{opacity:1}50%{opacity:.4}}
#chart-loading{font-family:var(--font-ui);font-size:10px;color:var(--text3);margin-left:2px}
#mobile-panel-btn{display:none}

/* ── CHART BODY ──────────────────────────────── */
#chart-body{flex:1;position:relative;overflow:hidden;cursor:crosshair;touch-action:none}
#chart-cv{display:block;width:100%;height:100%}
#crosshair-cv{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* ── SIGNALS PANEL ───────────────────────────── */
#signals-panel{
  width:262px;min-width:262px;border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
  background:var(--surface);flex-shrink:0
}
.panel-handle{display:none}
.sig-section{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sig-section:last-child{border-bottom:none;flex:1}
.sig-section-hdr{
  font-family:var(--font-ui);font-size:10px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px
}
.sig-section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.sig-empty{font-family:var(--font-ui);font-size:11px;color:var(--text3);padding:4px 0;font-style:italic}
.liq-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.liq-row:last-child{border-bottom:none}
.liq-badge{font-family:var(--font-ui);font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;letter-spacing:.2px}
.liq-badge.bsl{background:rgba(61,214,140,.1);color:var(--green2);border:1px solid rgba(61,214,140,.22)}
.liq-badge.ssl{background:rgba(246,70,93,.08);color:var(--red2);border:1px solid rgba(246,70,93,.18)}
.liq-badge.eq{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.22)}
.liq-price{color:var(--text);font-weight:600;flex:1;font-size:11px}
.liq-dist{font-family:var(--font-ui);font-weight:700;font-size:11px;white-space:nowrap}
.liq-dist.up{color:var(--green2)}.liq-dist.dn{color:var(--red2)}
.liq-sep{height:1px;background:var(--border);margin:5px 0}
.sig-ctx-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.sig-ctx-item:last-child{border-bottom:none}
.sig-ctx-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.sig-ctx-val{font-family:var(--font-data);color:var(--text2);font-weight:600;font-size:11px;text-align:right}

/* ── WALL BIAS ───────────────────────────────── */
.wall-bias-item{padding:7px 0 3px;border-top:1px solid rgba(255,255,255,.03);margin-top:3px}
.wall-bias-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.wall-bias-status{font-family:var(--font-data);font-weight:700;font-size:11px;color:var(--text2)}
.wall-bias-bar-outer{height:6px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;margin-bottom:5px}
.wall-bias-bar-bid{height:100%;background:var(--green2);transition:width .6s ease}
.wall-bias-bar-ask{height:100%;background:var(--red2);transition:width .6s ease}
.wall-bias-amounts{display:flex;justify-content:space-between}
.wall-bias-amt{font-family:var(--font-ui);font-size:9px;font-weight:600}

/* ── TRADE BUTTONS ───────────────────────────── */
.manual-trade-btns{display:flex;gap:8px}
.manual-long-btn{
  flex:1;background:rgba(46,160,107,.1);border:1px solid rgba(46,160,107,.26);
  color:var(--green2);padding:14px 4px;border-radius:10px;
  font-family:var(--font-ui);font-size:13px;cursor:pointer;font-weight:700;
  transition:var(--trans);text-align:center;min-height:48px
}
.manual-long-btn:hover{background:rgba(46,160,107,.2);border-color:rgba(46,160,107,.55);transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,160,107,.2)}
.manual-short-btn{
  flex:1;background:rgba(201,58,58,.08);border:1px solid rgba(201,58,58,.22);
  color:var(--red2);padding:14px 4px;border-radius:10px;
  font-family:var(--font-ui);font-size:13px;cursor:pointer;font-weight:700;
  transition:var(--trans);text-align:center;min-height:48px
}
.manual-short-btn:hover{background:rgba(201,58,58,.18);border-color:rgba(201,58,58,.48);transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,58,58,.2)}

/* ── ENTRY FORM ──────────────────────────────── */
.entry-form{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.ef-dir{font-family:var(--font-ui);font-size:14px;font-weight:700;text-align:center;padding:9px;border-radius:8px;margin-bottom:10px}
.ef-dir.long{background:rgba(46,160,107,.12);color:var(--green2);border:1px solid rgba(46,160,107,.28)}
.ef-dir.short{background:rgba(201,58,58,.1);color:var(--red2);border:1px solid rgba(201,58,58,.25)}
.ef-drag-hint{font-family:var(--font-ui);font-size:10px;color:var(--text3);text-align:center;margin-bottom:10px;padding:4px 8px;background:rgba(240,185,11,.05);border-radius:5px;border:1px solid rgba(240,185,11,.12)}
.ef-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ef-lbl{font-family:var(--font-ui);font-size:10px;font-weight:600;width:40px;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px}
.ef-lbl.entry-lbl{color:var(--yellow2)}.ef-lbl.tp-lbl{color:var(--green2)}.ef-lbl.sl-lbl{color:var(--red2)}.ef-lbl.tp2-lbl{color:rgba(61,214,140,.6)}
.ef-inp{
  flex:1;background:var(--surface3);border:1px solid var(--border2);color:var(--text);
  padding:7px 8px;border-radius:7px;font-family:var(--font-data);font-size:12px;
  outline:none;width:100%;transition:var(--trans);min-height:36px
}
.ef-inp:focus{border-color:rgba(240,185,11,.6);box-shadow:0 0 0 2px rgba(240,185,11,.1)}
.ef-inp.tp-inp:focus{border-color:rgba(61,214,140,.6);box-shadow:0 0 0 2px rgba(61,214,140,.08)}
.ef-inp.sl-inp:focus{border-color:rgba(246,70,93,.6);box-shadow:0 0 0 2px rgba(246,70,93,.08)}
.ef-inp.err{border-color:var(--red2)!important;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ef-rr-display{font-family:var(--font-data);font-size:13px;font-weight:700;text-align:center;padding:6px 0 5px;color:var(--yellow2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ef-btns{display:flex;gap:6px;margin-top:8px}
.ef-confirm{flex:1;background:rgba(46,160,107,.12);border:1px solid rgba(46,160,107,.3);color:var(--green2);padding:10px 4px;border-radius:7px;font-family:var(--font-ui);font-size:12px;cursor:pointer;transition:var(--trans);font-weight:700}
.ef-confirm:hover{background:rgba(46,160,107,.24);box-shadow:0 2px 12px rgba(46,160,107,.2)}
.ef-cancel{background:transparent;border:1px solid var(--border2);color:var(--text3);padding:10px 12px;border-radius:7px;font-family:var(--font-ui);font-size:13px;cursor:pointer;transition:var(--trans);font-weight:600}
.ef-cancel:hover{color:var(--red2);border-color:rgba(246,70,93,.3)}

/* ── ACTIVE TRADE CARD ───────────────────────── */
.active-trade-card{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.atc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.atc-dir{font-family:var(--font-ui);font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.atc-dir.long{background:rgba(46,160,107,.12);color:var(--green2);border:1px solid rgba(46,160,107,.25)}
.atc-dir.short{background:rgba(201,58,58,.1);color:var(--red2);border:1px solid rgba(201,58,58,.22)}
.atc-pnl{font-family:var(--font-data);font-size:20px;font-weight:700;line-height:1}
.atc-entry-line{font-family:var(--font-ui);font-size:10px;color:var(--text3);margin-bottom:9px;margin-top:2px}
.atc-hint{font-family:var(--font-ui);font-size:9px;color:var(--text3);text-align:center;padding:3px 0;margin-bottom:6px;opacity:.7}
.atc-lvl-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.atc-lvl-row:last-of-type{border-bottom:none;margin-bottom:9px}
.atc-lvl-lbl{font-family:var(--font-ui);color:var(--text3);font-size:10px}

function formatCandleTime(r){const s=Math.ceil(r/1000),m=Math.floor(s/60),sec=s%60;if(m>0)return`${m}:${sec.toString().padStart(2,'0')}`;return`${s}s`;}

function drawCandleTimer(ctx,cW,cAH,lE,PW,H,TH){

function priceToY(price){if(!chartLayout.cAH||chartHi<=chartLo)return -999;return((chartHi-price)/(chartHi-chartLo))*chartLayout.cAH;}
function yToPrice(y){if(!chartLayout.cAH||chartHi<=chartLo)return 0;return chartHi-(y/chartLayout.cAH)*(chartHi-chartLo);}
function getLineAtY(mouseY){if(!chartLayout.cAH)return null;const HIT=14;if(tradeSetup){const lines=[{name:'t1',price:tradeSetup.t1,src:'setup'},{name:'sl',price:tradeSetup.sl,src:'setup'},{name:'entry',price:tradeSetup.entry,src:'setup'},{name:'t2',price:tradeSetup.t2,src:'setup'}];for(const line of lines){if(!line.price||isNaN(line.price))continue;const y=priceToY(line.price);if(Math.abs(y-mouseY)<=HIT)return line;}}if(activeLogEntry&&!activeLogEntry.outcome){const e=activeLogEntry;const lines=[{name:'entry',price:e.entry,src:'active'},{name:'t1',price:e.t1?.price,src:'active'},{name:'sl',price:e.sl?.price,src:'active'},{name:'t2',price:e.t2?.price,src:'active'}];for(const line of lines){if(!line.price||isNaN(line.price))continue;const y=priceToY(line.price);if(Math.abs(y-mouseY)<=HIT)return line;}}return null;}
function updateActiveTradeLevel(key,price){if(!activeLogEntry||activeLogEntry.outcome||!price||isNaN(price))return;const e=activeLogEntry;if(key==='entry'){e.entry=price;if(e.t1)e.t1.pct=((e.t1.price-e.entry)/e.entry*100);if(e.sl)e.sl.pct=((e.sl.price-e.entry)/e.entry*100);if(e.t2)e.t2.pct=((e.t2.price-e.entry)/e.entry*100);}else if(e[key]){e[key].price=price;}}
function syncFormFromDrag(){if(!tradeSetup)return;const fmt=(v)=>v&&v!==0?v.toFixed(4):'';const set=(id,val)=>{const el=document.getElementById(id);if(el&&val!==null)el.value=fmt(val);};set('ef-entry',tradeSetup.entry);set('ef-t1',tradeSetup.t1);set('ef-t2',tradeSetup.t2);set('ef-sl',tradeSetup.sl);updateRRDisplay();}
function syncSetupFromForm(){if(!tradeSetup)return;const v=(id)=>parseFloat(document.getElementById(id)?.value);if(!isNaN(v('ef-entry')))tradeSetup.entry=v('ef-entry');if(!isNaN(v('ef-t1')))tradeSetup.t1=v('ef-t1');if(!isNaN(v('ef-t2')))tradeSetup.t2=v('ef-t2');if(!isNaN(v('ef-sl')))tradeSetup.sl=v('ef-sl');}

function drawTradeSetupLines(ctx,cW,cAH,lE,PW){if(!tradeSetup)return;const defs=[{key:'entry',price:tradeSetup.entry,color:'#f0b90b',label:'ENTRY'},{key:'t1',price:tradeSetup.t1,color:'#3dd68c',label:'T1'},{key:'t2',price:tradeSetup.t2,color:'#5ec7ff',label:'T2'},{key:'sl',price:tradeSetup.sl,color:'#f6465d',label:'SL'}];defs.forEach(d=>{if(!d.price||isNaN(d.price))return;const y=priceToY(d.price);if(y<0||y>cAH)return;ctx.strokeStyle=d.color;ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=d.color;ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText(d.label,lE+6,y-6);});}
function drawCrosshairLines(ctx,cW,cAH,lE,PW,slotW,H){if(cursorY==null||cursorY<0||cursorY>cAH)return;const cp=chartHi-(cursorY/cAH)*(chartHi-chartLo);ctx.strokeStyle='rgba(210,220,235,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(0,cursorY);ctx.lineTo(cW,cursorY);ctx.moveTo(cursorX||0,0);ctx.lineTo(cursorX||0,cAH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(11,15,23,.84)';ctx.fillRect((cursorX||0)+8,Math.max(8,cursorY-12),80,22);ctx.fillStyle='#e4eaf2';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText(fmtP(cp),(cursorX||0)+14,Math.max(22,cursorY+2));}
function redrawCrosshairCanvas(){const cv=document.getElementById('crosshair-cv');if(!cv)return;const{cAH,cW,lE,PW,slotW,H}=chartLayout;const ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,3);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cW,cAH);if(cursorX==null||cursorY==null)return;drawCrosshairLines(ctx,cW,cAH,lE,PW,slotW,H);}

// ── v61: Chart interaction + pointer/touch events ────────────
function initChartInteraction(){
  const body=document.getElementById('chart-body');

  body.addEventListener('mousemove',(e)=>{
    const rect=body.getBoundingClientRect();cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    if(tradeSetup?.dragging){tradeSetup[tradeSetup.dragging]=yToPrice(cursorY);syncFormFromDrag();redrawCrosshairCanvas();return;}
    if(activeLineDrag&&activeLogEntry&&!activeLogEntry.outcome){const np=yToPrice(cursorY);updateActiveTradeLevel(activeLineDrag,np);if(dragRafId)cancelAnimationFrame(dragRafId);dragRafId=requestAnimationFrame(()=>{drawChart();dragRafId=null;});return;}
    const lineInfo=getLineAtY(cursorY);body.style.cursor=lineInfo?'ns-resize':'crosshair';redrawCrosshairCanvas();
  });
  body.addEventListener('mousedown',(e)=>{
    if(!chartLayout.cAH)return;const rect=body.getBoundingClientRect();const my=e.clientY-rect.top;const lineInfo=getLineAtY(my);
    if(!lineInfo)return;if(lineInfo.src==='setup'&&tradeSetup)tradeSetup.dragging=lineInfo.name;else if(lineInfo.src==='active')activeLineDrag=lineInfo.name;
    body.style.cursor='ns-resize';e.preventDefault();
  });
  body.addEventListener('mouseup',()=>{
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    redrawCrosshairCanvas();
  });
  body.addEventListener('mouseleave',()=>{
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    cursorX=null;cursorY=null;redrawCrosshairCanvas();body.style.cursor='crosshair';
  });

  let pointerActive=false;
  body.addEventListener('pointerdown',(e)=>{
    if(e.pointerType==='mouse')return;
    body.setPointerCapture(e.pointerId);
    const rect=body.getBoundingClientRect();cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    const lineInfo=getLineAtY(cursorY);
    if(lineInfo){if(lineInfo.src==='setup'&&tradeSetup)tradeSetup.dragging=lineInfo.name;else if(lineInfo.src==='active')activeLineDrag=lineInfo.name;}
    pointerActive=true;redrawCrosshairCanvas();
  },{passive:true});

  body.addEventListener('pointermove',(e)=>{
    if(e.pointerType==='mouse'||!pointerActive)return;
    const rect=body.getBoundingClientRect();cursorX=e.clientX-rect.left;cursorY=e.clientY-rect.top;
    if(tradeSetup?.dragging){tradeSetup[tradeSetup.dragging]=yToPrice(cursorY);syncFormFromDrag();redrawCrosshairCanvas();return;}
    if(activeLineDrag&&activeLogEntry&&!activeLogEntry.outcome){updateActiveTradeLevel(activeLineDrag,yToPrice(cursorY));if(dragRafId)cancelAnimationFrame(dragRafId);dragRafId=requestAnimationFrame(()=>{drawChart();dragRafId=null;});return;}
    redrawCrosshairCanvas();
  },{passive:true});

  body.addEventListener('pointerup',(e)=>{
    if(e.pointerType==='mouse')return;
    pointerActive=false;
    if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;if(dragRafId){cancelAnimationFrame(dragRafId);dragRafId=null;}drawChart();}
    setTimeout(()=>{cursorX=null;cursorY=null;redrawCrosshairCanvas();},1800);
  },{passive:true});

  body.addEventListener('pointercancel',()=>{
    pointerActive=false;if(tradeSetup?.dragging)tradeSetup.dragging=null;
    if(activeLineDrag){activeLineDrag=null;drawChart();}
    cursorX=null;cursorY=null;redrawCrosshairCanvas();
  },{passive:true});
}

async function loadAllBinancePairs(){
  const countEl=document.getElementById('coin-panel-count');

    const [infoRes,tickerRes]=await Promise.all([fetch('https://fapi.binance.com/fapi/v1/exchangeInfo'),fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')]);

    const priceMap={};tickers.forEach(t=>{priceMap[t.symbol.toLowerCase()]=parseFloat(t.lastPrice)||0;});

    ALL_COINS.sort((a,b)=>b.vol24h-a.vol24h);

function calcVolumeProfile(candles,bins=60){if(!candles||candles.length<5)return null;const use=candles.slice(-100);let hi=-Infinity,lo=Infinity,totalVol=0;use.forEach(c=>{if(c.h>hi)hi=c.h;if(c.l<lo)lo=c.l;totalVol+=c.v;});const span=hi-lo||1,step=span/bins;const buckets=[];for(let i=0;i<bins;i++){buckets[i]={price:lo+i*step,vol:0};}use.forEach(c=>{const range=(c.h-c.l)||1;for(let i=0;i<bins;i++){const b=buckets[i];if(c.h>=b.price&&c.l<=b.price+step){b.vol+=c.v;}}});const bucket=buckets.reduce((best,cur)=>cur.vol>best.vol?cur:best,{vol:-Infinity,price:0});return{vpocPrice:bucket.price, vahPrice:hi, valPrice:lo, totalVol};}
function calcMarketStructure(candles,lb=5){if(!candles||candles.length<lb*3+5)return null;const sH=[],sL=[];for(let i=lb;i<candles.length-lb;i++){let isH=true,isL=true;for(let j=1;j<=lb;j++){if(candles[i-j].h>=candles[i].h){isH=false;}if(candles[i-j].l<=candles[i].l){isL=false;}}if(isH)sH.push(candles[i]);if(isL)sL.push(candles[i]);}const latest=candles[candles.length-1];const lastHigh=sH[sH.length-1]||latest;const lastLow=sL[sL.length-1]||latest;return{structure:lastHigh.h>lastLow.l&&latest.c>lastHigh.h?'bullish':latest.c<lastLow.l?'bearish':'flat',bos:lastHigh.h>lastLow.l?{type:'bullish',price:lastHigh.h}:{type:'bearish',price:lastLow.l}};}
function calcSR(allC){if(allC.length<10)return{supports:[],resistances:[]};const LB=4,highs=[],lows=[];for(let i=LB;i<allC.length-LB;i++){const c=allC[i];let isH=true,isL=true;for(let j=1;j<=LB;j++){if(allC[i-j].h>=c.h||allC[i+j].h>=c.h)isH=false;if(allC[i-j].l<=c.l||allC[i+j].l<=c.l)isL=false;}if(isH)highs.push({price:c.h,confirmed:true});if(isL)lows.push({price:c.l,confirmed:true});}return{supports:lows.slice(-5),resistances:highs.slice(-5)};}
function calcATRPct(n=14){if(!candles||candles.length<3||!livePrice)return 0;const use=candles.slice(-Math.min(n+1,candles.length));let sum=0,count=0;for(let i=1;i<use.length;i++){const c=use[i],p=use[i-1];sum+=Math.abs(c.h-c.l);count++;}return count?((sum/count)/livePrice)*100:0;}
function calcNetCVD(n=100){const recent=tradeBuffer.slice(-n);if(!recent.length)return 0;const net=recent.reduce((s,t)=>s+(t.isBuy?t.vol:-t.vol),0);return net/(recent.reduce((s,t)=>s+t.vol,0)||1);}
function calcLiquidityZones(){if(!candles||candles.length<20||!livePrice)return{bsl:[],ssl:[]};const LB=5,swingHighs=[],swingLows=[],useC=candles.slice(-120);for(let i=LB;i<useC.length-LB;i++){let isH=true,isL=true;for(let j=1;j<=LB;j++){if(useC[i-j].h>=useC[i].h||useC[i+j].h>=useC[i].h)isH=false;if(useC[i-j].l<=useC[i].l||useC[i+j].l<=useC[i].l)isL=false;}if(isH)swingHighs.push(useC[i]);if(isL)swingLows.push(useC[i]);}const bsl=swingLows.slice(-3).map(c=>({price:c.l,isEqual:Math.abs(c.l-livePrice)/livePrice<0.003,type:'bsl'}));const ssl=swingHighs.slice(-3).map(c=>({price:c.h,isEqual:Math.abs(c.h-livePrice)/livePrice<0.003,type:'ssl'}));return{bsl,ssl};}
function captureOBSnapshot(){if(!livePrice||!book.bids.length||!book.asks.length)return;const bidUSD=book.bids.reduce((s,b)=>s+b.usd,0),askUSD=book.asks.reduce((s,a)=>s+a.usd,0),total=(bidUSD+askUSD)||1;obSnaps.push({ts:Date.now(),bid:bidUSD,total,ask:askUSD});if(obSnaps.length>MAX_SNAPS)obSnaps.shift();}
function startSnapshotScheduler(){if(snapTimerID){clearTimeout(snapTimerID);clearInterval(snapTimerID);}snapTimerID=null;obSnaps=[];snapTimerID=setTimeout(()=>{captureOBSnapshot();snapTimerID=setInterval(captureOBSnapshot,SNAP_INTERVAL);},1000);}

function drawVPOC(ctx,vp,p2y,cW,cAH){if(!vp)return;const vahY=p2y(vp.vahPrice),valY=p2y(vp.valPrice);if(vahY>=0&&valY<=cAH){ctx.fillStyle='rgba(88,166,255,0.025)';ctx.fillRect(0,Math.max(0,vahY),cW,Math.max(6,Math.abs(valY-vahY)));}}
function drawConfirmedSR(ctx,sr,p2y,cW,cAH){sr.supports.filter(s=>s.confirmed).slice(0,3).forEach(s=>{const y=p2y(s.price);if(y<4||y>cAH)return;ctx.fillStyle='rgba(46,160,107,0.08)';ctx.fillRect(0,y,cW,1.5);});sr.resistances.filter(s=>s.confirmed).slice(0,3).forEach(s=>{const y=p2y(s.price);if(y<4||y>cAH)return;ctx.fillStyle='rgba(201,58,58,0.08)';ctx.fillRect(0,y,cW,1.5);});}
function drawBOS(ctx,ms,p2y,cW,cAH){if(!ms||!ms.bos)return;const y=p2y(ms.bos.price);if(y<2||y>cAH-2)return;const col=ms.bos.type==='bullish'?'rgba(61,214,140,0.5)':'rgba(246,70,93,0.45)';ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();}
function drawLiquidityZones(ctx,p2y,cW,cAH){if(!livePrice)return;const zones=getLZ();zones.bsl.slice(0,3).forEach((z,i)=>{const y=p2y(z.price);if(y<2||y>cAH)return;ctx.strokeStyle='rgba(61,214,140,.75)';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.setLineDash([]);});zones.ssl.slice(0,3).forEach((z,i)=>{const y=p2y(z.price);if(y<2||y>cAH)return;ctx.strokeStyle='rgba(246,70,93,.75)';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.setLineDash([]);});}
function drawOrderCircles(ctx,p2y,cW,cAH){if(!livePrice||!book.bids.length||!book.asks.length)return;const bids=book.bids.filter(o=>o.usd>=THRESHOLD).sort((a,b)=>b.usd-a.usd).slice(0,8),asks=book.asks.filter(o=>o.usd>=THRESHOLD).sort((a,b)=>b.usd-a.usd).slice(0,8);bids.forEach((o,i)=>{const y=p2y(o.price);if(y<0||y>cAH)return;ctx.fillStyle='rgba(61,214,140,.6)';ctx.beginPath();ctx.arc(cW-20-i*8,y,3,0,Math.PI*2);ctx.fill();});asks.forEach((o,i)=>{const y=p2y(o.price);if(y<0||y>cAH)return;ctx.fillStyle='rgba(246,70,93,.6)';ctx.beginPath();ctx.arc(20+i*8,y,3,0,Math.PI*2);ctx.fill();});}
function drawActiveTrade(ctx,p2y,cW,cAH,lE,PW){if(!activeLogEntry||activeLogEntry.outcome||!livePrice)return;const e=activeLogEntry,isLong=e.direction==='LONG',gc=isLong?'rgba(61,214,140,.9)':'rgba(246,70,93,.9)';if(e.entry){const y=p2y(e.entry);ctx.fillStyle='rgba(240,185,11,.86)';ctx.fillRect(lE+8,y-1,PW-20,2);}if(e.t1&&e.t1.price){const y=p2y(e.t1.price);ctx.fillStyle='rgba(61,214,140,.7)';ctx.fillRect(lE+8,y-1,PW-20,2);}if(e.sl&&e.sl.price){const y=p2y(e.sl.price);ctx.fillStyle='rgba(246,70,93,.7)';ctx.fillRect(lE+8,y-1,PW-20,2);}}

function roundToNice(v){if(v<500)return Math.ceil(v/50)*50;if(v<2000)return Math.ceil(v/100)*100;if(v<10000)return Math.ceil(v/500)*500;if(v<50000)return Math.ceil(v/1000)*1000;if(v<200000)return Math.ceil(v/5000)*5000;return Math.ceil(v/10000)*10000;}
function calcAutoThreshold(){if(!book.bids.length||!book.asks.length)return;const allOrders=[...book.bids,...book.asks];if(allOrders.length<4)return;const totalUsd=allOrders.reduce((s,o)=>s+o.usd,0),avg=totalUsd/allOrders.length;THRESHOLD=Math.max(10000,Math.min(500000,roundToNice(avg*1.5)));document.getElementById('thr-inp').value=THRESHOLD;}
function updateAutoBtn(isAuto){const btn=document.getElementById('auto-thr-btn');if(!btn)return;btn.textContent=isAuto?'AUTO ✓':'AUTO';btn.className=isAuto?'auto':'manual';}
setInterval(()=>{if(isAutoThreshold&&book.bids.length)calcAutoThreshold();},15000);
function setConn(on,txt){document.getElementById('conn-dot').className=on?'on':'';document.getElementById('conn-txt').textContent=txt;}
function closeSocket(s){if(!s)return;s.onopen=s.onerror=s.onclose=s.onmessage=null;try{s.close();}catch(e){}}
function connect(){closeSocket(ws);ws=null;closeSocket(wsM);wsM=null;if(rtimer){clearTimeout(rtimer);rtimer=null;}if(uiTimer){clearTimeout(uiTimer);uiTimer=null;}if(chartTimer){clearTimeout(chartTimer);chartTimer=null;}connectBinanceFutures();connectKlineSocket();}
function connectBinanceFutures(){const aS=sym;try{ws=new WebSocket(`wss://fstream.binance.com/stream?streams=${aS}@ticker/${aS}@trade/${aS}@bookTicker`);}catch(e){setConn(false,'Error');rtimer=setTimeout(connect,4000);}}
function connectKlineSocket(){try{wsM=new WebSocket(`wss://fstream.binance.com/stream?streams=${sym}@kline_${chartInterval}`);}catch(e){setConn(false,'Error');rtimer=setTimeout(connect,4000);}}
function handleBinMsg(e){let msg;try{msg=JSON.parse(e.data);}catch(_){return;}if(!msg||!msg.data)return;const d=msg.data;const stream=msg.stream||'';if(stream.includes('@ticker')){const p=parseFloat(d.p);if(!isNaN(p))onTickP(p);}else if(stream.includes('@trade')){onTrade(d);}else if(stream.includes('@bookTicker')){const b=parseFloat(d.b),a=parseFloat(d.a);if(!isNaN(b)&&!isNaN(a)){const mid=(b+a)/2;processBook([{price:b,qty:1,usd:b*1},{price:b*1.0005,qty:1,usd:b*1.0005}], [{price:a,qty:1,usd:a},{price:a*0.9995,qty:1,usd:a*0.9995}]);if(!livePrice)livePrice=mid;}}else if(stream.includes('@kline')){onKline(d);}}
function onTickP(p){prevPrice=livePrice;livePrice=p;const lp=document.getElementById('live-price');lp.textContent=fmtP(p);lp.className=p>=prevPrice?'':'dn';}
function onTrade(d){const isBuy=!d.m,vol=parseFloat(d.p)*parseFloat(d.q);tradeBuffer.push({isBuy,vol});if(tradeBuffer.length>300)tradeBuffer.shift();}
function onDepthBin(d){const parse=(arr,fn)=>arr.map(([p,q])=>{const pr=parseFloat(p),qt=parseFloat(q);return{price:pr,qty:qt,usd:pr*qt};}).sort(fn);processBook(parse(d.b||d.bids||[],(a,b)=>b.price-a.price),parse(d.a||d.asks||[],(a,b)=>a.price-b.price));}
function processBook(nB,nA){if(!livePrice&&nB.length&&nA.length)livePrice=(nB[0].price+nA[0].price)/2;if(livePrice){detectHunts(nB,nA);updateWallTs(nB,nA);}book={bids:nB,asks:nA};updateWalls(nB,nA);renderSignalsPanel();renderStats();drawChart();}
function onKline(d){const k=d.k;if(k.i!==chartInterval)return;const c={t:k.t,o:+k.o,h:+k.h,l:+k.l,c2:+k.c,v:+k.v,live:!k.x};if(candles.length>0&&candles[candles.length-1].t===k.t){candles[candles.length-1]=c;}else{candles.push(c);if(candles.length>400)candles.shift();}clearAnalysisCache();renderSignalsPanel();renderStats();drawChart();}
function loadCandles(){const lbl=document.getElementById('chart-loading');lbl.textContent='Loading…';fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym.toUpperCase()}&interval=${chartInterval}&limit=200`).then(r=>r.json()).then(data=>{candles=data.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c2:+k[4],v:+k[5]}));clearAnalysisCache();renderSignalsPanel();renderStats();drawChart();lbl.textContent='';}).catch(()=>{lbl.textContent='Retrying…';setTimeout(loadCandles,1500);});}
function updateWalls(b,a){const nb={},na={};b.forEach(x=>{if(x.usd>=THRESHOLD)nb[x.price]=x.usd;});a.forEach(x=>{if(x.usd>=THRESHOLD)na[x.price]=x.usd;});prevWalls={bids:nb,asks:na};}
function updateWallTs(b,a){const now=Date.now(),ac=new Set();b.forEach(x=>{if(x.usd>=THRESHOLD){const k=`bid-${x.price}`;ac.add(k);if(!wallTimestamps[k])wallTimestamps[k]=now;}});a.forEach(x=>{if(x.usd>=THRESHOLD){const k=`ask-${x.price}`;ac.add(k);if(!wallTimestamps[k])wallTimestamps[k]=now;}});Object.keys(wallTimestamps).forEach(k=>{if(!ac.has(k))delete wallTimestamps[k];});}
function detectHunts(nB,nA){const nb={},na={};nB.forEach(b=>{if(b.usd>=THRESHOLD)nb[b.price]=b.usd;});nA.forEach(a=>{if(a.usd>=THRESHOLD)na[a.price]=a.usd;});const tol=livePrice*0.002;Object.entries(nb).forEach(([p,v])=>{const price=Number(p);if(Math.abs(price-livePrice)<tol*1.5){addHunt(price,v,'bid');}});Object.entries(na).forEach(([p,v])=>{const price=Number(p);if(Math.abs(price-livePrice)<tol*1.5){addHunt(price,v,'ask');}});}
function addHunt(price,usd,side){const now=Date.now(),key=`${side}-${price}`;if(hunts.some(h=>h.key===key&&now-h.ts<8000))return;hunts.unshift({key,price,usd,side,ts:now});if(hunts.length>20)hunts.pop();}

function renderSignalsPanel(){if(!livePrice||!book.bids.length)return;renderLiquidityZonesPanel();renderKeyLevels();renderManualEntryArea();}
function renderLiquidityZonesPanel(){const el=document.getElementById('liq-zones-list');if(!el)return;const zones=getLZ();let html='';zones.bsl.forEach(z=>{const badge='<span class="liq-badge bsl">BSL</span>';html+=`<div class="liq-row">${badge}<span class="liq-price">${fmtP(z.price)}</span><span class="liq-dist up">${Math.abs((z.price-livePrice)/livePrice*100).toFixed(2)}%</span></div>`;});zones.ssl.forEach(z=>{const badge='<span class="liq-badge ssl">SSL</span>';html+=`<div class="liq-row">${badge}<span class="liq-price">${fmtP(z.price)}</span><span class="liq-dist dn">${Math.abs((z.price-livePrice)/livePrice*100).toFixed(2)}%</span></div>`;});if(!html)html='<div class="sig-empty">No clear liquidity zones yet.</div>';el.innerHTML=html;}
function renderKeyLevels(){
  const vp=getVP(),ms=getMS(),cvd=calcNetCVD(),atr=calcATRPct(14);
  const cvdColor=cvd>0.1?'var(--green2)':cvd<-0.1?'var(--red2)':'var(--text2)';
  const s=id=>document.getElementById(id);
  if(s('kl-vpoc'))s('kl-vpoc').textContent=vp?fmtP(vp.vpocPrice):'—';
  if(s('kl-vah'))s('kl-vah').textContent=vp?fmtP(vp.vahPrice):'—';
  if(s('kl-val'))s('kl-val').textContent=vp?fmtP(vp.valPrice):'—';
  if(s('kl-cvd')){s('kl-cvd').textContent=(cvd>=0?'+':'')+(cvd*100).toFixed(0)+'%';s('kl-cvd').style.color=cvdColor;}
  if(s('kl-atr'))s('kl-atr').textContent=atr.toFixed(2)+'%/bar';
  if(s('kl-struct')&&ms){const arrow=ms.structure==='bullish'?'▲':ms.structure==='bearish'?'▼':'→';s('kl-struct').textContent=`${arrow} ${ms.structure.charAt(0).toUpperCase()+ms.structure.slice(1)}`;}
  if(livePrice){
    const askWalls=book.asks.filter(o=>o.usd>=THRESHOLD&&o.price>livePrice);
    const bidWalls=book.bids.filter(o=>o.usd>=THRESHOLD&&o.price<livePrice);
    const totalAsk=askWalls.reduce((sum,o)=>sum+o.usd,0),totalBid=bidWalls.reduce((sum,o)=>sum+o.usd,0);
    const total=(totalAsk+totalBid)||1,bidPct=totalBid/total*100,askPct=100-bidPct;
    if(s('wb-bid-bar'))s('wb-bid-bar').style.width=(totalAsk+totalBid>0?bidPct:50).toFixed(1)+'%';
    if(s('wb-ask-bar'))s('wb-ask-bar').style.width=(totalAsk+totalBid>0?askPct:50).toFixed(1)+'%';
    if(s('wb-bid-amt'))s('wb-bid-amt').textContent=totalBid>0?`▲ ${fmtV(totalBid)} (${bidWalls.length})`:'▲ none';
    if(s('wb-ask-amt'))s('wb-ask-amt').textContent=totalAsk>0?`${fmtV(totalAsk)} (${askWalls.length}) ▼`:'none ▼';
    if(s('kl-wall-bias')){let lbl,col;if(totalAsk===0&&totalBid===0){lbl='No walls';col='var(--text3)';}else if(bidPct>=60){lbl='▲ BID HEAVY';col='var(--green2)';}else if(askPct>=60){lbl='▼ ASK HEAVY';col='var(--red2)';}else{lbl='⟷ BALANCED';col='var(--yellow2)';}s('kl-wall-bias').textContent=lbl;s('kl-wall-bias').style.color=col;}
  }
}
function renderManualEntryArea(){const area=document.getElementById('manual-entry-area');if(!area)return;if(manualEntryDir!==null)return;if(activeLogEntry&&!activeLogEntry.outcome){const e=activeLogEntry;area.innerHTML=`<div class="active-trade-card"><div class="atc-header"><span class="atc-dir ${e.direction==='LONG'?'long':'short'}">${e.direction}</span><span class="atc-pnl ${e.pnl>=0?'pos':''}">${e.pnl?((e.pnl*100).toFixed(2))+'%':''}</span></div><div class="atc-entry-line">Entry ${fmtP(e.entry)} · T1 ${fmtP(e.t1?.price||e.entry)} · SL ${fmtP(e.sl?.price||e.entry)}</div><div class="atc-hint">Drag levels on the chart to adjust.</div><div class="atc-lvl-row"><span class="atc-lvl-lbl">Entry</span><span class="atc-lvl-val">${fmtP(e.entry)}</span></div><div class="atc-lvl-row"><span class="atc-lvl-lbl">T1</span><span class="atc-lvl-val">${fmtP(e.t1?.price||e.entry)}</span></div><div class="atc-lvl-row"><span class="atc-lvl-lbl">T2</span><span class="atc-lvl-val">${fmtP(e.t2?.price||e.entry)}</span></div><div class="atc-lvl-row"><span class="atc-lvl-lbl">SL</span><span class="atc-lvl-val">${fmtP(e.sl?.price||e.entry)}</span></div><button class="atc-close" id="manual-close-btn">CLOSE TRADE</button></div>`;document.getElementById('manual-close-btn').addEventListener('click',()=>{activeLogEntry=null;renderManualEntryArea();renderLogModal();saveTradeLog();});return;}area.innerHTML=`<div class="manual-trade-btns"><button class="manual-long-btn" id="manual-long-btn">▲ LONG</button><button class="manual-short-btn" id="manual-short-btn">▼ SHORT</button></div>`;document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));}
function openEntryForm(dir){manualEntryDir=dir;const area=document.getElementById('manual-entry-area');if(!area)return;const isLong=dir==='LONG',atr=calcATRPct(14),t1Dist=Math.max(1.0,atr*1.5)/100,slDist=Math.max(0.8,atr*1.2)/100;const entry=livePrice||0;const t1=entry*(1+ (isLong?t1Dist:-t1Dist)),t2=entry*(1+ (isLong?t1Dist*1.7:-t1Dist*1.7)),sl=entry*(1+ (isLong?-slDist:slDist));tradeSetup={dir,entry,t1,t2,sl};area.innerHTML=`<div class="entry-form"><div class="ef-dir ${isLong?'long':'short'}">${dir} ENTRY</div><div class="ef-drag-hint">Drag the yellow, green, and red lines on the chart to fine-tune the setup.</div><div class="ef-row"><label class="ef-lbl entry-lbl">Entry</label><input class="ef-inp" id="ef-entry" value="${fmtP(entry)}"></div><div class="ef-row"><label class="ef-lbl tp-lbl">T1</label><input class="ef-inp tp-inp" id="ef-t1" value="${fmtP(t1)}"></div><div class="ef-row"><label class="ef-lbl tp2-lbl">T2</label><input class="ef-inp" id="ef-t2" value="${fmtP(t2)}"></div><div class="ef-row"><label class="ef-lbl sl-lbl">SL</label><input class="ef-inp sl-inp" id="ef-sl" value="${fmtP(sl)}"></div><div class="ef-rr-display" id="ef-rr">RR —</div><div class="ef-btns"><button class="ef-confirm" id="ef-confirm">CONFIRM</button><button class="ef-cancel" id="ef-cancel">CANCEL</button></div></div>`;updateRRDisplay();document.getElementById('ef-confirm').addEventListener('click',confirmManualEntry);document.getElementById('ef-cancel').addEventListener('click',cancelEntryForm);['ef-entry','ef-t1','ef-t2','ef-sl'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{syncSetupFromForm();updateRRDisplay();drawChart();}));}
function cancelEntryForm(){manualEntryDir=null;tradeSetup=null;const area=document.getElementById('manual-entry-area');if(!area)return;area.innerHTML=`<div class="manual-trade-btns"><button class="manual-long-btn" id="manual-long-btn">▲ LONG</button><button class="manual-short-btn" id="manual-short-btn">▼ SHORT</button></div>`;document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));}
function confirmManualEntry(){if(!tradeSetup)return;syncSetupFromForm();const{dir,entry,t1,t2,sl}=tradeSetup;if(!entry||!t1||!sl){alert('Please fill in all trade levels.');return;}const e=manualLogSetup(dir,entry,t1,t2,sl);tradeLog.push(e);activeLogEntry=e;saveTradeLog();updateLogButtonUI();manualEntryDir=null;tradeSetup=null;renderManualEntryArea();renderLogModal();closeMobilePanel();}
function manualLogSetup(dir,entryPrice,t1Price,t2Price,slPrice){const ms=getMS(),vp=getVP(),atrPct=calcATRPct(14),coin=document.getElementById('coin-btn-sym').textContent;const mkLvl=(price)=>({price, pct:((price-entryPrice)/entryPrice*100)*(dir==='LONG'?1:-1)});return{id:Date.now()+Math.random(),direction:dir,coin,entry:entryPrice,t1:mkLvl(t1Price),t2:mkLvl(t2Price),sl:mkLvl(slPrice),openedAt:Date.now(),outcome:null,pnl:0,score:Math.round((ms?.structure==='bullish'?60:ms?.structure==='bearish'?40:50)+(vp?10:0)+(atrPct>0?5:0)),status:'active'};}
function loadTradeLog(){try{const s=localStorage.getItem('lh_trade_log_v2');if(s)tradeLog=JSON.parse(s);}catch(e){tradeLog=[];}const act=tradeLog.find(e=>!e.outcome&&!e.resolvedAt);if(act)activeLogEntry=act;updateLogButtonUI();}
function saveTradeLog(){try{localStorage.setItem('lh_trade_log_v2',JSON.stringify(tradeLog.slice(0,100)));}catch(e){}}
function updateLogOutcomes(){if(!livePrice||!activeLogEntry||activeLogEntry.outcome){activeLogEntry=null;return;}const e=activeLogEntry,isLong=e.direction==='LONG',pp=(livePrice-e.entry)/e.entry*100;const pnl= isLong ? pp : -pp;activeLogEntry.pnl=Math.max(-1, Math.min(1, pnl));e.pnl=pnl; if(pnl>=0.8 && e.t1 && !e.t1.hit){e.t1.hit=true;e.outcome='T1_HIT';e.resolvedAt=Date.now();} else if(pnl<=-0.8 && e.sl){e.outcome='SL_HIT';e.resolvedAt=Date.now();}}
function resolveLogEntry(e,outcome,exitPrice){e.outcome=outcome;e.exitPrice=exitPrice;const isLong=e.direction==='LONG';e.exitPct=((exitPrice-e.entry)/e.entry*100)*(isLong?1:-1);e.resolvedAt=Date.now();saveTradeLog();}
function updateLogButtonUI(){const btn=document.getElementById('log-btn'),cEl=document.getElementById('log-count'),total=tradeLog.length,active=tradeLog.filter(e=>!e.outcome).length;if(btn)btn.classList.toggle('has-active',active>0);if(cEl){cEl.textContent=String(total);cEl.classList.toggle('show',total>0);}}
function openLogModal(){logModalOpen=true;document.getElementById('log-modal').classList.add('open');renderLogModal();}
function closeLogModal(){logModalOpen=false;document.getElementById('log-modal').classList.remove('open');}
function renderLogModal(){const wins=tradeLog.filter(e=>e.outcome==='T1_HIT'||e.outcome==='T2_HIT').length,losses=tradeLog.filter(e=>e.outcome==='SL_HIT').length,wr=Math.round((wins/(wins+losses||1))*100);document.getElementById('log-summary-pills').innerHTML=`<span class="log-summary-pill win">W ${wins}</span><span class="log-summary-pill loss">L ${losses}</span><span class="log-summary-pill rate">WR ${wr}%</span>`;if(logActiveTab==='active'){document.getElementById('log-content').innerHTML=renderLogActive();}else if(logActiveTab==='history'){document.getElementById('log-content').innerHTML=renderLogHistory();}else{document.getElementById('log-content').innerHTML=renderLogStats();}}
function renderLogActive(){const e=activeLogEntry||tradeLog.find(x=>!x.outcome);if(!e)return`<div class="log-active-empty">No active trade.<br>Use the ▲ LONG or ▼ SHORT buttons to enter.</div>`;const color=e.direction==='LONG'?'long':'short';const price=livePrice||e.entry;const pnl=((price-e.entry)/e.entry*100)*(e.direction==='LONG'?1:-1);return `<div class="log-active-setup"><div class="las-header"><span class="las-dir-badge ${color}">${e.direction}</span><span class="las-coin">${e.coin}</span><span class="las-score">${pnl>=0?'+':''}${pnl.toFixed(2)}%</span></div><div class="las-meta">Entry ${fmtP(e.entry)} · Active · ${new Date(e.openedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div><div class="las-grid"><div class="las-levels"><div class="las-levels-title">Levels</div>${['t1','t2','sl'].map(key=>{const level=e[key];return `<div class="las-level-row"><span class="las-level-icon">${key==='sl'?'▼':key==='t1'?'▲':'⬢'}</span><div class="las-level-info"><span class="las-level-pct ${level.pct>=0?'pos':'neg'}">${Math.abs(level.pct).toFixed(2)}%</span><span class="las-level-px">${fmtP(level.price)}</span><span class="las-level-lbl">${key==='sl'?'Stop loss':key==='t1'?'Target 1':'Target 2'}</span></div><span class="las-level-status hit">Live</span></div>`;}).join('')}</div><div class="las-context"><div class="las-ctx-title">Context</div><div class="las-ctx-row"><span class="las-ctx-lbl">Trend</span><span class="las-ctx-val ${getMS()?.structure==='bullish'?'bull':'bear'}">${getMS()?.structure||'Flat'}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">VPOC</span><span class="las-ctx-val">${fmtP(getVP()?.vpocPrice||e.entry)}</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">ATR</span><span class="las-ctx-val">${calcATRPct(14).toFixed(2)}%</span></div><div class="las-ctx-row"><span class="las-ctx-lbl">CVD</span><span class="las-ctx-val">${(calcNetCVD()*100).toFixed(0)}%</span></div></div></div></div>`;}
function renderLogHistory(){if(tradeLog.length===0)return'<div class="log-history-empty">No trades logged yet.</div>';return `<table class="log-history-table"><thead><tr><th>PAIR</th><th>DIR</th><th>OUTCOME</th><th>P/L</th><th>TIME</th></tr></thead><tbody>${tradeLog.slice().reverse().map(e=>{const pos=e.outcome==='T1_HIT'||e.outcome==='T2_HIT';const cls=pos?'win-row':e.outcome==='SL_HIT'?'loss-row':'';const badge=e.outcome?e.outcome==='T1_HIT'||e.outcome==='T2_HIT'?'<span class="log-outcome-badge t2">T2 HIT</span>':e.outcome==='SL_HIT'?'<span class="log-outcome-badge sl">SL</span>':'<span class="log-outcome-badge closed">Closed</span>':'<span class="log-outcome-badge active">ACTIVE</span>';return `<tr class="${cls}"><td>${e.coin}</td><td class="log-td-dir ${e.direction==='LONG'?'long':'short'}">${e.direction}</td><td>${badge}</td><td class="log-pl ${e.exitPct>=0?'pos':'neg'}">${e.exitPct?`${e.exitPct>=0?'+':''}${e.exitPct.toFixed(2)}%`:—}</td><td>${new Date(e.openedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td></tr>`;}).join('')}</tbody></table>`;}
function renderLogStats(){const resolved=tradeLog.filter(e=>e.outcome&&e.outcome!=='EXPIRED'&&e.outcome!=='MANUAL_CLOSE'),wins=resolved.filter(e=>e.outcome==='T1_HIT'||e.outcome==='T2_HIT'),losses=resolved.filter(e=>e.outcome==='SL_HIT');const net=wins.reduce((s,e)=>s+(e.exitPct||0),0)-losses.reduce((s,e)=>s+(e.exitPct||0),0);const rate=((wins.length/(resolved.length||1))*100).toFixed(0);return `<div class="log-stats-grid"><div class="log-stat-card"><div class="log-stat-card-title">Net</div><div class="log-stat-big ${net>=0?'green':'red'}">${net>=0?'+':''}${net.toFixed(1)}%</div><div class="log-stat-sub">Across ${resolved.length} resolved trades</div></div><div class="log-stat-card"><div class="log-stat-card-title">Wins</div><div class="log-stat-big green">${wins.length}</div><div class="log-stat-sub">${rate}% win rate</div></div><div class="log-stat-card"><div class="log-stat-card-title">Losses</div><div class="log-stat-big red">${losses.length}</div><div class="log-stat-sub">Avg loss ${(losses.length?((losses.reduce((s,e)=>s+Math.abs(e.exitPct||0),0)/losses.length)).toFixed(1):0)}%</div></div></div>`;}

function renderStats(){const{bids,asks}=book;if(!bids.length||!asks.length)return;document.getElementById('cs-spread').textContent=fmtP(asks[0].price-bids[0].price);const cvd=calcNetCVD(),dEl=document.getElementById('cs-cvd');if(dEl){dEl.textContent=(cvd>=0?'+':'')+(cvd*100).toFixed(0)+'%';dEl.className=cvd>0.05?'bull':cvd<-0.05?'bear':'flat';}}

function drawChart(){
  const cv=document.getElementById('chart-cv'),body=document.getElementById('chart-body');
  const W=body.offsetWidth||940,H=body.offsetHeight||700;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const ccv=document.getElementById('crosshair-cv');if(ccv){ccv.width=Math.round(W*dpr);ccv.height=Math.round(H*dpr);}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0b0f17';ctx.fillRect(0,0,W,H);
  if(!candles.length){ctx.fillStyle='#5e7082';ctx.font='13px monospace';ctx.textAlign='center';ctx.fillText('Loading chart…',W/2,H/2);return;}
  const PW=68,LW=68,TH=18,VH=Math.round(H*0.10),cW=W-PW-LW,lS=cW,lE=W-PW,cAH=H-TH-VH;
  const slotW=Math.max(4,cW/Math.min(candles.length,120)),numVis=Math.floor(cW/slotW),vis=candles.slice(-numVis),n=vis.length;
  if(!n)return;
  const bW=Math.max(1.5,slotW*0.65);
  let hi=-Infinity,lo=Infinity,mV=0;
  vis.forEach(c=>{if(c.h>hi)hi=c.h;if(c.l<lo)lo=c.l;if(c.v>mV)mV=c.v;});mV=mV||1;
  if(book.bids.length&&livePrice){[...book.bids,...book.asks].filter(o=>o.usd>=THRESHOLD).forEach(o=>{if(o.price>lo*.995&&o.price<hi*1.005){if(o.price>hi)hi=o.price;if(o.price<lo)lo=o.price;}});}
  if(activeLogEntry&&!activeLogEntry.outcome){const at=activeLogEntry;[at.entry,at.t1?.price,at.t2?.price,at.sl?.price].forEach(p=>{if(p&&!isNaN(p)&&p>0){if(p>hi)hi=p;if(p<lo)lo=p;}});}
  if(tradeSetup){[tradeSetup.entry,tradeSetup.t1,tradeSetup.t2,tradeSetup.sl].forEach(p=>{if(p&&!isNaN(p)&&p>0){if(p>hi)hi=p;if(p<lo)lo=p;}});}
  const pad=(hi-lo)*.07;hi+=pad;lo-=pad;
  const pr=hi-lo||1,p2y=p=>((hi-p)/pr)*cAH;
  chartHi=hi;chartLo=lo;chartLayout={cAH,cW,lE,PW,slotW,bW,H};
  for(let i=0;i<=8;i++){const y=i*(cAH/8);ctx.strokeStyle=i===4?'#151e2d':'#0f1620';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();}
  drawVPOC(ctx,getVP(),p2y,cW,cAH);drawConfirmedSR(ctx,getSR(),p2y,cW,cAH);drawBOS(ctx,getMS(),p2y,cW,cAH);drawLiquidityZones(ctx,p2y,cW,cAH);
  vis.forEach((c,i)=>{const x=i*slotW+slotW/2,isUp=c.c2>=c.o,col=isUp?'#2ea06b':'#c93a3a',colL=isUp?'#3dd68c':'#f6465d';ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,slotW*.1);ctx.beginPath();ctx.moveTo(x,Math.max(0,p2y(c.h)));ctx.lineTo(x,Math.max(0,p2y(c.l)));ctx.stroke();ctx.strokeStyle=colL;ctx.lineWidth=Math.max(1.5,bW);ctx.beginPath();ctx.moveTo(x,Math.max(0,p2y(c.o)));ctx.lineTo(x,Math.max(0,p2y(c.c2)));ctx.stroke();});
  drawOrderCircles(ctx,p2y,cW,cAH);
  if(livePrice){const y=p2y(livePrice);if(y>=0&&y<=cAH){ctx.strokeStyle=livePrice>=prevPrice?'rgba(46,160,107,.3)':'rgba(201,58,58,.28)';ctx.lineWidth=1;ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.setLineDash([]);}}
  drawActiveTrade(ctx,p2y,cW,cAH,lE,PW);drawTradeSetupLines(ctx,cW,cAH,lE,PW);
  ctx.fillStyle='#4a5a72';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('VOL',4,H-TH-2);
  const cWL=lE-lS;ctx.fillStyle='#0b0f17';ctx.fillRect(lS,0,cWL,H-TH);ctx.strokeStyle='#111925';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lS,0);ctx.lineTo(lS,H-TH);ctx.stroke();ctx.fillStyle='#4a5a72';ctx.font='8px monospace';ctx.textAlign='center';const orderLabels=[...book.bids.filter(o=>o.usd>=THRESHOLD).slice(0,5), ...book.asks.filter(o=>o.usd>=THRESHOLD).slice(0,5)];
  if(book.bids.length){const allO=[...book.bids,...book.asks];let maxUsd=0;allO.forEach(o=>{if(o.usd>maxUsd)maxUsd=o.usd;});maxUsd=maxUsd||1;const midX=lS+cWL/2;ctx.strokeStyle='#111925';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(midX,0);ctx.lineTo(midX,H-TH);ctx.stroke();}
  ctx.fillStyle='#0b0f17';ctx.fillRect(lE,0,PW,H);ctx.strokeStyle='#1e2d40';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lE,0);ctx.lineTo(lE,H);ctx.stroke();
  ctx.fillStyle='#7a8fa4';ctx.font='9px monospace';ctx.textAlign='left';for(let i=0;i<=9;i++){const price=hi-(pr/9)*i,y=p2y(price);if(y<0||y>cAH)continue;ctx.strokeStyle='#0c1218';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.fillText(fmtP(price),4,y+3);}
  if(livePrice){const y=p2y(livePrice);if(y>=0&&y<=cAH){const col=livePrice>=prevPrice?'#2ea06b':'#c93a3a';ctx.fillStyle=col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(lE+1,y-9,PW-3,18,3);else ctx.rect(lE+1,y-9,PW-3,18);ctx.fill();ctx.fillStyle='#0b0f17';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(fmtP(livePrice),lE+PW/2,y+3);}}
  drawCandleTimer(ctx,cW,cAH,lE,PW,H,TH);
  ctx.fillStyle='#6b7d92';ctx.font='8px monospace';ctx.textAlign='center';const lbE=Math.max(1,Math.floor(n/8));vis.forEach((c,i)=>{if(i%lbE!==0)return;const x=i*slotW+slotW/2,d=new Date(c.t);ctx.fillText(`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`,x,H-4);});
  const ld=[{col:'rgba(240,185,11,.8)',dash:true,lbl:'VPOC'},{col:'rgba(46,160,107,.75)',lbl:'Support'},{col:'rgba(201,58,58,.75)',lbl:'Resistance'},{col:'rgba(61,214,140,.7)',dash:true,lbl:'BSL'},{col:'rgba(246,70,93,.7)',dash:true,lbl:'SSL'}];let lx=20;ctx.font='8px monospace';ctx.textAlign='left';ld.forEach(item=>{ctx.strokeStyle=item.col;ctx.lineWidth=1.5;ctx.setLineDash(item.dash?[5,5]:[]);ctx.beginPath();ctx.moveTo(lx,cAH-8);ctx.lineTo(lx+18,cAH-8);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=item.col;ctx.fillText(item.lbl,lx+26,cAH-6);lx+=70;});
  redrawCrosshairCanvas();
}

function changeInterval(newTF){
  if(newTF===chartInterval)return;
  chartInterval=newTF;candles=[];clearAnalysisCache();
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===newTF));
  loadCandles();startCandleTimer();
}

function resetAndConnect(){
  livePrice=0;prevPrice=0;book={bids:[],asks:[]};prevWalls={bids:{},asks:{}};hunts=[];tradeBuffer=[];wallTimestamps={};obSnaps=[];clearAnalysisCache();
  const lp=document.getElementById('live-price');if(lp)lp.textContent='Loading…';
  ['cs-spread','cs-cvd'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='—';});
  const lz=document.getElementById('liq-zones-list');if(lz)lz.innerHTML='<div class="sig-empty">Loading…</div>';
  const ma=document.getElementById('manual-entry-area');if(ma&&!activeLogEntry&&!manualEntryDir){ma.innerHTML=`<div class="manual-trade-btns"><button class="manual-long-btn" id="manual-long-btn">▲ LONG</button><button class="manual-short-btn" id="manual-short-btn">▼ SHORT</button></div>`;document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));}
  connect();startSnapshotScheduler();
}

function fmtP(p){if(!p&&p!==0)return'—';if(p>=1000)return p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=1)return p.toFixed(4);return p.toFixed(6);}
function fPS(p){if(!p)return'0';if(p>=1000)return(p/1000).toFixed(1)+'k';if(p>=1)return p.toFixed(2);return p.toFixed(4);}
function fmtV(v){const cs=currSym;if(v>=1e9)return cs+(v/1e9).toFixed(2)+'B';if(v>=1e6)return cs+(v/1e6).toFixed(2)+'M';if(v>=1e3)return cs+(v/1e3).toFixed(1)+'K';return cs+v.toFixed(0);}

// ── Event listeners ───────────────────────────────────────────

document.getElementById('thr-inp').addEventListener('input',function(){const v=parseInt(this.value);if(!isNaN(v)&&v>=100){if(isAutoThreshold){isAutoThreshold=false;updateAutoBtn(false);}THRESHOLD=v;renderSignalsPanel();renderStats();drawChart();}});
document.getElementById('auto-thr-btn').addEventListener('click',()=>{isAutoThreshold=true;updateAutoBtn(true);if(book.bids.length){calcAutoThreshold();renderStats();drawChart();}});
document.getElementById('bubble-btn').addEventListener('click',toggleBubbleMode);
document.querySelectorAll('.tf-btn').forEach(btn=>btn.addEventListener('click',()=>changeInterval(btn.dataset.tf)));
document.getElementById('log-btn').addEventListener('click',()=>{logModalOpen?closeLogModal():openLogModal();});
document.getElementById('log-close-btn').addEventListener('click',closeLogModal);
document.getElementById('log-clear-btn').addEventListener('click',()=>{if(confirm('Clear all trade log entries?')){tradeLog=[];activeLogEntry=null;saveTradeLog();updateLogButtonUI();renderLogModal();}});document.getElementById('log-modal').addEventListener('click',e=>{if(e.target===document.getElementById('log-modal'))closeLogModal();});
document.querySelectorAll('.log-tab').forEach(btn=>{btn.addEventListener('click',()=>{logActiveTab=btn.dataset.tab;document.querySelectorAll('.log-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderLogModal();});});
document.getElementById('manual-long-btn').addEventListener('click',()=>openEntryForm('LONG'));
document.getElementById('manual-short-btn').addEventListener('click',()=>openEntryForm('SHORT'));
document.getElementById('mobile-panel-btn').addEventListener('click',openMobilePanel);
document.getElementById('panel-backdrop').addEventListener('click',closeMobilePanel);
document.getElementById('panel-handle').addEventListener('click',closeMobilePanel);
window.addEventListener('resize',()=>{drawChart();if(window.innerWidth>768)closeMobilePanel();});

// ── Init ──────────────────────────────────────────────────────
loadTradeLog();
initChartInteraction();
startCandleTimer();
updateAutoBtn(true);
loadAllBinancePairs().then(()=>{resetAndConnect();refreshAllPrices();});
</script>
</body></html>
